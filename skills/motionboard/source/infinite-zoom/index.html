<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #17181c;
        --sub: #5c6070;
        --mut: #9094a2;
        --line: #e8e8ed;
        --line2: #f1f1f4;
        --side: #f6f6f8;
        --acc: #0f9d6e;
        --accs: #e5f5ee;
        --font-ui: "Inter", -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fff;
        font-family: var(--font-ui); color: var(--ink); -webkit-font-smoothing: antialiased;
      }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      svg { display: block; flex: none; }

      .world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; opacity: 0; }
      #w0 { opacity: 1; }

      /* ---------- one product screen, 1920 x 1080 ---------- */
      .scn { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #fff; font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; transform-origin: 0 0; }
      .scn * { box-sizing: border-box; }
      .a { position: absolute; }
      .t { position: absolute; white-space: nowrap; line-height: 1.25; }
      .fx { display: flex; align-items: center; }
      .sp { flex: 1; }
      .slot { position: absolute; left: 0; top: 0; overflow: hidden; background: #f1f2f5; }

      /* sidebar */
      .sb { position: absolute; left: 0; top: 0; width: 244px; height: 1080px; background: var(--side); border-right: 1px solid var(--line); padding: 14px 10px; }
      .sbh { display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 6px; font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em; }
      .sbh svg.g { color: #80848f; }
      .wsw { display: flex; align-items: center; gap: 9px; height: 34px; margin-top: 6px; padding: 0 8px; border-radius: 8px; font-size: 14px; font-weight: 600; }
      .wsw .wa { width: 20px; height: 20px; border-radius: 6px; background: #1f2937; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
      .wsw svg { color: #9094a2; }
      .srch { display: flex; align-items: center; gap: 8px; height: 34px; margin: 8px 0 8px; padding: 0 10px; border: 1px solid var(--line); background: #fff; border-radius: 8px; color: var(--mut); font-size: 13.5px; }
      kbd { font-family: var(--font-ui); font-size: 11px; font-weight: 500; color: #8a8e9b; background: #f1f1f4; border-radius: 4px; padding: 2px 5px; }
      .srch kbd { margin-left: auto; }
      .ni { display: flex; align-items: center; gap: 10px; height: 31px; padding: 0 8px; border-radius: 7px; font-size: 14px; font-weight: 500; color: #3a3d48; white-space: nowrap; }
      .ni.on { background: #e9e9ee; color: var(--ink); font-weight: 600; }
      .ni svg { color: #7a7e8a; }
      .ni .bd { margin-left: auto; font-size: 11.5px; font-weight: 600; color: #fff; background: var(--acc); border-radius: 9px; padding: 1px 6px; }
      .ni .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; margin: 0 4px 0 4px; }
      .sl { font-size: 12px; font-weight: 600; color: #8a8e9b; padding: 16px 8px 6px; }
      .sbf { position: absolute; left: 10px; right: 10px; bottom: 14px; }
      .usr { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; border-top: 1px solid var(--line); margin-top: 6px; font-size: 14px; font-weight: 600; }

      /* top bar */
      .tb { position: absolute; left: 244px; top: 0; width: 1676px; height: 52px; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 28px 0 28px; background: #fff; z-index: 3; }
      .crumb { display: flex; align-items: center; gap: 9px; font-size: 14px; color: var(--sub); font-weight: 500; white-space: nowrap; }
      .crumb b { color: var(--ink); font-weight: 600; }
      .crumb svg { color: #a5a9b5; }
      .btn { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border: 1px solid #dedee4; border-radius: 8px; background: #fff; font-size: 13.5px; font-weight: 500; color: #2c2f3a; white-space: nowrap; }
      .btn svg { color: #747885; }
      .btn.pri { background: var(--acc); border-color: var(--acc); color: #fff; font-weight: 600; }
      .btn.pri svg { color: #fff; }
      .btn.ic { width: 32px; padding: 0; justify-content: center; }
      .btn.sm { height: 28px; font-size: 12.5px; padding: 0 10px; }

      /* shared bits */
      .av { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 600; flex: none; }
      .pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 12px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
      .pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; }
      .card { background: #fff; border-radius: 12px; box-shadow: 0 0 0 1px #e3e3e8, 0 1px 2px rgba(15, 23, 42, 0.04); }
      .h3 { font-size: 14.5px; font-weight: 600; letter-spacing: -0.005em; white-space: nowrap; }
      .mut { color: var(--mut); }
      .sub { color: var(--sub); }

      /* projects */
      .pg { position: absolute; background: #fff; border-radius: 12px; box-shadow: 0 0 0 1px #e3e3e8, 0 1px 2px rgba(15, 23, 42, 0.04); }
      .cv { position: absolute; left: 0; top: 0; overflow: hidden; border-radius: 12px 12px 0 0; background: #fff; }
      .pi { width: 22px; height: 22px; border-radius: 6px; color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
      .seg { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--sub); white-space: nowrap; }
      .seg.on { background: #efeff3; color: var(--ink); font-weight: 600; }
      .seg b { font-weight: 500; color: var(--mut); }

      /* overview */
      .stat { position: absolute; height: 92px; padding: 14px 16px; }
      .tab { display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 2px; margin-right: 22px; font-size: 14px; font-weight: 500; color: var(--sub); white-space: nowrap; }
      .tab.on { color: var(--ink); font-weight: 600; box-shadow: inset 0 -2px 0 var(--acc); }
      .tab span { font-size: 12px; color: var(--mut); font-weight: 500; }
      .ms { display: flex; align-items: center; height: 46px; padding: 0 20px; border-top: 1px solid var(--line2); font-size: 14px; font-weight: 500; white-space: nowrap; }
      .bar { height: 6px; border-radius: 3px; background: #ececf0; position: relative; overflow: hidden; }
      .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--acc); }

      /* board */
      .kcol { position: absolute; width: 382px; display: flex; flex-direction: column; gap: 10px; }
      .kc { position: relative; background: #fff; border-radius: 10px; padding: 12px 14px 12px; box-shadow: 0 0 0 1px #e6e6eb, 0 1px 2px rgba(15, 23, 42, 0.05); }
      .k1 { display: flex; align-items: center; gap: 8px; height: 22px; }
      .k1 .id { font-size: 12px; color: var(--mut); font-weight: 500; }
      .k2 { font-size: 14.5px; line-height: 20px; font-weight: 500; margin: 6px 0 10px; letter-spacing: -0.005em; }
      .k3 { display: flex; align-items: center; gap: 6px; height: 22px; font-size: 12px; color: var(--mut); font-weight: 500; }
      .k3 .m { display: flex; align-items: center; gap: 4px; margin-left: 6px; }
      .kh { position: absolute; height: 28px; display: flex; align-items: center; gap: 8px; width: 382px; font-size: 14px; font-weight: 600; }
      .kh span { color: var(--mut); font-weight: 500; font-size: 13px; }

      /* issue */
      .pr { display: flex; align-items: center; gap: 12px; height: 34px; font-size: 14px; font-weight: 500; white-space: nowrap; }
      .pr label { width: 92px; color: var(--mut); font-size: 13px; font-weight: 500; }
      .cmt { position: absolute; display: flex; gap: 12px; }
      .cmt .hd { font-size: 14px; font-weight: 600; }
      .cmt .hd span { font-weight: 400; color: var(--mut); margin-left: 8px; font-size: 13px; }
      .cmt .bd { font-size: 14.5px; line-height: 22px; color: #2c2f3a; margin-top: 3px; }

      /* ---------- cursor ---------- */
      #cur { position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 30; }
      #curi { position: absolute; left: -2px; top: -2px; width: 24px; height: 28px; }
      #curi svg { width: 24px; height: 28px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.3)); }
      #rip { position: absolute; left: -24px; top: -24px; width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--acc); opacity: 0; z-index: 29; }
      #vig { pointer-events: none; z-index: 20; background: radial-gradient(ellipse at 50% 50%, rgba(20, 24, 40, 0) 70%, rgba(20, 24, 40, 0.05) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="scene" class="clip full" data-start="0" data-duration="10" data-track-index="0">
        <div id="w0" class="world" data-layout-allow-overlap data-layout-ignore></div>
        <div id="w1" class="world" data-layout-allow-overlap data-layout-ignore></div>
        <div id="w2" class="world" data-layout-allow-overlap data-layout-ignore></div>
        <div id="w3" class="world" data-layout-allow-overlap data-layout-ignore></div>
        <div id="rip"></div>
        <div id="cur" data-layout-ignore>
          <div id="curi">
            <svg viewBox="0 0 24 28"><path d="M2 2 L2 22.5 L7.4 17.6 L11.4 26.4 L15 24.8 L11 16.2 L18.6 16.2 Z" fill="#111" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
          </div>
        </div>
      </div>
      <div id="vig" class="clip full" data-start="0" data-duration="10" data-track-index="1"></div>
    </div>

    <script>
      const ACC = "#0f9d6e";

      /* ---------- icons (lucide-style, 1.5px strokes) ---------- */
      const ICON = {
        chD: '<path d="m6 9 6 6 6-6"/>',
        chR: '<path d="m9 18 6-6-6-6"/>',
        chL: '<path d="m15 18-6-6 6-6"/>',
        chU: '<path d="m18 15-6-6-6 6"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
        home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
        inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
        checkC: '<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
        layers: '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
        folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
        list: '<path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/>',
        file: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
        target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
        kanban: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 7v7"/><path d="M12 7v4"/><path d="M16 7v9"/>',
        gantt: '<path d="M3 5h8"/><path d="M7 12h10"/><path d="M13 19h8"/><path d="M3 19h4"/>',
        bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
        edit: '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>',
        plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
        more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
        filter: '<path d="M22 3H2l8 9.46V19l4 2v-8.54z"/>',
        sliders: '<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
        grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
        star: '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/>',
        link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
        clip: '<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
        msg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
        cal: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
        clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
        tag: '<path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".6" fill="currentColor"/>',
        users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>',
        chart: '<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/>',
        pr: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v12"/>',
        share: '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/>',
        eye: '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>',
        help: '<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
        arrowUR: '<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
        user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
        send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>'
      };
      const ic = (n, s, sw, st) =>
        '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 1.5) +
        '" stroke-linecap="round" stroke-linejoin="round"' + (st ? ' style="' + st + '"' : "") + ">" + ICON[n] + "</svg>";
      const MARK = (s) =>
        '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="' + ACC + '"/><g transform="translate(4.6 4.6) scale(0.6)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' + ICON.layers + "</g></svg>";

      /* issue status and priority glyphs */
      const STC = { backlog: "#a0a4b0", todo: "#a0a4b0", prog: "#e7a20b", review: "#3b82f6", done: ACC };
      const STB = {
        backlog: '<circle cx="12" cy="12" r="8.5" stroke-dasharray="2.6 2.6"/>',
        todo: '<circle cx="12" cy="12" r="8.5"/>',
        prog: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7a5 5 0 0 1 0 10z" fill="currentColor" stroke="none"/>',
        review: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7a5 5 0 1 1-5 5h5z" fill="currentColor" stroke="none"/>',
        done: '<circle cx="12" cy="12" r="9.5" fill="currentColor" stroke="none"/><path d="m8.3 12.4 2.5 2.5 4.9-5" stroke="#fff" stroke-width="2"/>'
      };
      const st = (k, s) =>
        '<svg width="' + (s || 16) + '" height="' + (s || 16) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:' + STC[k] + '">' + STB[k] + "</svg>";
      const pri = (l) => {
        const c = (i) => (i < l ? "#5c6070" : "#d3d5dc");
        return '<svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="9" width="3" height="5" rx="1" fill="' + c(0) + '"/><rect x="6.5" y="6" width="3" height="8" rx="1" fill="' + c(1) + '"/><rect x="11" y="3" width="3" height="11" rx="1" fill="' + c(2) + '"/></svg>';
      };

      /* ---------- people ---------- */
      const PE = {
        maya: ["Maya Chen", "MC", "#d9577f"],
        liam: ["Liam Ortiz", "LO", "#3b82f6"],
        priya: ["Priya Nair", "PN", "#8b5cf6"],
        daniel: ["Daniel Kim", "DK", "#6d6bd8"],
        sofia: ["Sofia Reyes", "SR", "#1fa5a5"],
        hana: ["Hana Sato", "HS", "#e8803a"],
        omar: ["Omar Haddad", "OH", "#64748b"],
        ethan: ["Ethan Walker", "EW", "#b7791f"],
        aisha: ["Aisha Khan", "AK", "#c2410c"]
      };
      const av = (k, s, ex) =>
        '<span class="av" style="width:' + s + "px;height:" + s + "px;font-size:" + (s * 0.4).toFixed(1) + "px;background:" + PE[k][2] + (ex || "") + '">' + PE[k][1] + "</span>";
      const avs = (ks, s) => ks.map((k, i) => av(k, s, ";margin-left:" + (i ? -s * 0.2 : 0) + "px;box-shadow:0 0 0 2px #fff")).join("");

      const LBL = {
        Payments: ["#e6efff", "#2457c5"], Bug: ["#fde7e7", "#b42318"], Design: ["#f1e8ff", "#6a3fc4"],
        Feature: ["#e2f5ec", "#0b7a55"], Chore: ["#eeeff2", "#555b66"], Mobile: ["#fff0d9", "#9a5a06"]
      };
      const lb = (n) => '<span class="chip" style="background:' + LBL[n][0] + ";color:" + LBL[n][1] + '">' + n + "</span>";
      const SPILL = {
        ok: ["On track", "#e2f5ec", "#0b7a55"], risk: ["At risk", "#fff0d9", "#9a5a06"], plan: ["Planned", "#eeeff2", "#555b66"],
        done: ["Completed", "#e6efff", "#2457c5"]
      };
      const pill = (k) => '<span class="pill" style="background:' + SPILL[k][1] + ";color:" + SPILL[k][2] + '"><i></i>' + SPILL[k][0] + "</span>";

      const T = (x, y, s, css) => '<div class="t" style="left:' + x + "px;top:" + y + "px;" + (css || "") + '">' + s + "</div>";
      const B = (x, y, w, h, css) => '<div class="a" style="left:' + x + "px;top:" + y + "px;width:" + w + "px;height:" + h + "px;" + (css || "") + '"></div>';

      /* ---------- thumbnails (drawn at 512 x 288, scaled to fit) ---------- */
      function path(pts) { return pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" "); }
      function cChart(title, big, delta, data, col) {
        const mx = Math.max.apply(null, data), n = data.length;
        const P1 = data.map((v, i) => [24 + (i * 464) / (n - 1), 250 - (v / mx) * 138]);
        const P2 = data.map((v, i) => [24 + (i * 464) / (n - 1), 250 - (v / mx) * 138 * (0.62 + 0.1 * Math.sin(i * 1.3))]);
        let grid = "";
        for (let i = 0; i < 5; i++) grid += '<path d="M24 ' + (250 - i * 35) + 'H488" stroke="#e8ebef" stroke-width="1"/>';

        }
      }
      /* the cursor comes back and returns to where it started, so the last frame equals the first */
      const TR = LV[3] + PUSHES[3] + DV;
      F("#cur", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, TR);
      F("#cur", { x: CLICK[3][0], y: CLICK[3][1] }, { x: P0[0], y: P0[1], duration: 0.85, ease: "power2.inOut" }, TR);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
