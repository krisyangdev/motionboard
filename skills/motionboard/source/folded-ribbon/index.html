  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.5" data-width="1920" data-height="1080">
      <div id="ui" class="clip full" data-start="5.05" data-duration="5.45" data-track-index="0">
        <div id="uiBg" class="full"></div>
        <div id="uiCam" class="full" data-layout-allow-overlap>
          <div id="win" data-layout-allow-overlap data-layout-ignore></div>
          <div id="cur">
            <div id="curi">
              <svg viewBox="0 0 24 28"><path d="M2 2 L2 22.5 L7.4 17.6 L11.4 26.4 L15 24.8 L11 16.2 L18.6 16.2 Z" fill="#111" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
            </div>
          </div>
        </div>
        <div id="scrim" class="full"></div>
        <div id="mark" data-layout-allow-overflow>
          <svg width="120" height="120" viewBox="0 0 38 38"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a78ff"/><stop offset="1" stop-color="#5a42f0"/></linearGradient></defs><rect width="38" height="38" rx="10" fill="url(#mg)"/><path d="M11 27 L16 11 H29 L24 27 Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/></svg>
          Planar
        </div>
      </div>

      <div id="rib" class="clip full" data-start="0" data-duration="5.05" data-track-index="1">
        <div id="rows" class="view full" data-layout-allow-overlap>
          <div id="cam3" class="full" data-layout-allow-overlap></div>
        </div>
        <div id="bands" class="view full" data-layout-allow-overlap>
          <div id="bw" class="full" data-layout-allow-overlap></div>
        </div>
      </div>

      <div id="wipe" class="clip full" data-start="4.3" data-duration="1.5" data-track-index="2">
        <div id="wg" data-layout-allow-overlap></div>
      </div>

      <div id="grain" class="clip full" data-start="0" data-duration="10.5" data-track-index="3"></div>
      <div id="vig" class="clip full" data-start="0" data-duration="10.5" data-track-index="4"></div>
    </div>

    <script>
      /* ============================================================
         Folded Ribbon Text
         0.0-1.0   two-line title on black (one panel per word group)
         1.0-3.4   each line folds at its word breaks, the camera pitches and pulls back,
                   six more rows multiply the field
         3.0-5.05  wide arrow bands fly past, then a violet band wipes to the editor
         5.05-8.35 Planar editor: Rotate Y handle drag, then Distance slider drag
         8.35-10.5 editor dims and pulls back under the Planar lockup
         Everything 3D is a pure function of time: render(t).
         ============================================================ */
      const DUR = 10.5;
      const D2R = Math.PI / 180;
      const clamp = (x, a, b) => Math.min(b === undefined ? 1 : b, Math.max(a === undefined ? 0 : a, x));
      const lerp = (a, b, u) => a + (b - a) * u;
      const seg = (t, a, b) => clamp((t - a) / (b - a));
      const eExpoOut = (u) => (u >= 1 ? 1 : 1 - Math.pow(2, -10 * u));
      const eIO3 = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
      const eOut3 = (u) => 1 - Math.pow(1 - u, 3);
      const eIO2 = (u) => 0.5 - 0.5 * Math.cos(Math.PI * u);

      /* monotone cubic keyframes: smooth, no overshoot, flat where neighbours are equal */
      function kf(t, k) {
        const n = k.length;
        if (t <= k[0][0]) return k[0][1];
        if (t >= k[n - 1][0]) return k[n - 1][1];
        let i = 0;
        while (t > k[i + 1][0]) i++;
        const d = [], m = [];
        for (let j = 0; j < n - 1; j++) d[j] = (k[j + 1][1] - k[j][1]) / (k[j + 1][0] - k[j][0]);
        m[0] = d[0]; m[n - 1] = d[n - 2];
        for (let j = 1; j < n - 1; j++) m[j] = d[j - 1] * d[j] <= 0 ? 0 : (d[j - 1] + d[j]) / 2;
        for (let j = 0; j < n - 1; j++) {
          if (d[j] === 0) { m[j] = 0; m[j + 1] = 0; continue; }
          const a = m[j] / d[j], b = m[j + 1] / d[j], s = a * a + b * b;
          if (s > 9) { const q = 3 / Math.sqrt(s); m[j] = q * a * d[j]; m[j + 1] = q * b * d[j]; }
        }
        const h = k[i + 1][0] - k[i][0], u = (t - k[i][0]) / h;
        const u2 = u * u, u3 = u2 * u;
        return (2 * u3 - 3 * u2 + 1) * k[i][1] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * k[i + 1][1] + (u3 - u2) * h * m[i + 1];
      }

      /* ---------- icons (lucide-style, 24 grid) ---------- */

      /* Each row is one printed line cut at the word breaks: one panel per word group, so every crease

            x += dx; zz += dz;
          });
          const ox = x / 2, oz = zz / 2;
          pn.forEach((p, i) => {
            p.x = p.x - ox + xx; p.y = yy; p.z = p.z - oz;
            const b = 1 - 0.5 * fold * (p.a > 0 ? 1 : 0);
            const wv = seg(t, 2.95 + 0.1 * i + 0.055 * r.j, 3.45 + 0.1 * i + 0.055 * r.j);
            const w0 = seg(t, 0.3 + 0.12 * i + 0.12 * r.j, 0.8 + 0.12 * i + 0.12 * r.j);

            p.b = b;
            p.rise = r.hero ? (1 - eExpoOut(seg(t, 0.12 * r.par, 0.8 + 0.12 * r.par))) * 170 : 0;

          cx = lerp(H_END[0], slX(P0), u); cy = lerp(HOME_C[1], SLY, u);
        } else { cx = slX(pp); cy = SLY; }
        if (t >= 8.3) { const u = eIO2(seg(t, 8.3, 8.6)); cx += 40 * u; cy += 32 * u; }
        cur.style.opacity = Math.min(clamp((t - 5.5) / 0.3), 1 - clamp((t - 8.3) / 0.3)).toFixed(3);
        cur.style.transform = "translate(" + cx.toFixed(2) + "px," + cy.toFixed(2) + "px)";
        curi.style.transform = "scale(" + (press1 || press2 ? 0.86 : 1) + ")";
        hRot.style.transform = press1 ? "scale(1.35)" : "scale(1)";
        hRot.style.background = press1 ? "var(--acc)" : "#fff";
        fldRY.className = "fld" + (press1 ? " hi" : "");
        fldPP.className = "fld" + (press2 ? " hi" : "");

        /* tooltip chip sits above the selected frame (clear of phone content) and follows the cursor horizontally during the Rotate Y drag */
        tip.style.left = cx - 370 - 62 + "px";
        tip.style.top = 160 - 102 + "px";
        tip.style.opacity = (clamp((t - 6.25) / 0.15) * (1 - clamp((t - 7.35) / 0.2))).toFixed(3);

        /* lockup */
        mark.style.opacity = eOut3(seg(t, 8.35, 8.85)).toFixed(3);
        scrim.style.opacity = eIO2(seg(t, 8.0, 8.5)).toFixed(3);
        mark.style.transform = "translateY(" + ((1 - eExpoOut(seg(t, 8.35, 9.35))) * 36).toFixed(2) + "px) scale(" + (1 + 0.025 * seg(t, 9.0, 10.5)).toFixed(4) + ")";
      }

      /* ---------- timeline ---------- */
      function render(t) {
        if (t < 5.05) { renderRows(t); renderBands(t); }
        if (t >= 4.3 && t < 5.8) renderWipe(t);
        if (t >= 5.05) renderUI(t);
      }
      const tl = gsap.timeline({ paused: true });
      render(0);
      tl.to({ v: 0 }, { v: 1, duration: DUR, ease: "none", onUpdate: () => render(tl.time()) }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
