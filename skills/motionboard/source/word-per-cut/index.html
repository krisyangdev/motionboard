<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --accent: #5b5bf0;
        --ink: #17161b;
        --cream: #f3efe6;
        --font-ui: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
        --font-serif: "EB Garamond", "Playfair Display", serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #08080b; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #08080b; font-family: var(--font-ui); color: var(--ink); -webkit-font-smoothing: antialiased; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .ic { flex: none; display: block; }
      .ci { display: flex; flex: none; }
      .grow { flex: 1; min-width: 0; }

      /* ---------- one cut: screen + camera + word ---------- */
      .scr { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; perspective: 1800px; perspective-origin: 50% 50%; }
      .scr::after { content: ""; position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 4; background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.42) 100%); }
      .scr.l::after { background: radial-gradient(ellipse at 50% 50%, rgba(40, 36, 60, 0) 55%, rgba(40, 36, 60, 0.18) 100%); }
      .cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 960px 540px; }
      .wall { position: absolute; left: -1400px; top: -1000px; width: 4720px; height: 3080px; }
      .veil { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 2; pointer-events: none; }
      .word { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 3; display: flex; align-items: center; justify-content: center; }
      .word span { display: block; font-family: var(--font-serif); font-weight: 500; font-size: 184px; line-height: 1; letter-spacing: -0.025em; white-space: nowrap; padding-bottom: 14px; }
      .cap { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 3; display: flex; align-items: center; justify-content: center; }
      .cap span { display: block; font-family: var(--font-mono); font-weight: 400; font-size: 38px; line-height: 1; letter-spacing: 0.01em; color: #f6f3ee; white-space: nowrap; padding: 17px 32px 19px; border-radius: 14px; background: rgba(8, 8, 12, 0.72); text-shadow: 0 1px 18px rgba(0, 0, 0, 0.5); }
      .cap i { font-style: normal; color: #a9a9ff; }

      .d .wall { background: radial-gradient(1500px 1000px at 15% 10%, #2b2a6e 0%, rgba(43, 42, 110, 0) 70%), radial-gradient(1400px 1000px at 90% 95%, #4a2a62 0%, rgba(74, 42, 98, 0) 70%), #0b0b14; }
      .l .wall { background: radial-gradient(1500px 1000px at 10% 10%, #d9d4ff 0%, rgba(217, 212, 255, 0) 70%), radial-gradient(1400px 1000px at 90% 95%, #ffd6c2 0%, rgba(255, 214, 194, 0) 70%), radial-gradient(1200px 900px at 100% 0%, #bfd7ff 0%, rgba(191, 215, 255, 0) 70%), #ebe7f3; }
      .d .veil { background: radial-gradient(ellipse 1000px 340px at 50% 50%, rgba(6, 6, 10, 0.72) 0%, rgba(6, 6, 10, 0.46) 62%, rgba(6, 6, 10, 0) 100%); }
      .l .veil { background: radial-gradient(ellipse 1240px 440px at 50% 50%, rgba(250, 249, 253, 0.72) 0%, rgba(250, 249, 253, 0.56) 30%, rgba(250, 249, 253, 0.26) 62%, rgba(250, 249, 253, 0.07) 84%, rgba(250, 249, 253, 0) 100%); }
      .d .word span { color: #f8f4ec; text-shadow: 0 2px 44px rgba(0, 0, 0, 0.4); }
      .l .word span { color: #17161b; text-shadow: 0 0 44px rgba(255, 255, 255, 0.5); }
      .c .veil { background: radial-gradient(ellipse 1100px 420px at 50% 50%, rgba(6, 6, 10, 0.5) 0%, rgba(6, 6, 10, 0.14) 100%); }
      .c.l .veil { background: radial-gradient(ellipse 1240px 440px at 50% 50%, rgba(250, 249, 253, 0.56) 0%, rgba(250, 249, 253, 0.38) 34%, rgba(250, 249, 253, 0.14) 70%, rgba(250, 249, 253, 0) 100%); }
      .c.l .cap span { background: rgba(250, 249, 253, 0.94); border: 1px solid rgba(23, 22, 27, 0.08); box-shadow: 0 6px 24px rgba(30, 28, 60, 0.12); color: #17161b; text-shadow: 0 0 24px rgba(255, 255, 255, 0.6); }
      .c.l .cap i { color: #5b5bf0; }

      /* ---------- theme tokens ---------- */
      .l { --bg2: #f3f3f6; --pn: #ffffff; --pn2: #f9f9fb; --ln: #e8e8ec; --tx: #1d1d1f; --tx2: #5b5e66; --tx3: #8b8f97; --hov: rgba(0, 0, 0, 0.055); --ac: #5b5bf0; --acb: #5b5bf0; --acbg: #eff0fe; --chip: #ffffff; --sel: #f1f1f4; }
      .d { --bg2: #0f0f13; --pn: #17171c; --pn2: #1c1c22; --ln: #2a2a32; --tx: #ececf1; --tx2: #a7a7b2; --tx3: #757580; --hov: rgba(255, 255, 255, 0.07); --ac: #9a9aff; --acb: #5b5bf0; --acbg: rgba(91, 91, 240, 0.22); --chip: #1c1c22; --sel: #222229; }

      /* ---------- window ---------- */
      .win { position: absolute; left: 180px; top: 90px; width: 1560px; height: 900px; border-radius: 12px; overflow: hidden; background: var(--bg2); color: var(--tx2); font-size: 13px; font-variant-numeric: tabular-nums; box-shadow: 0 40px 100px rgba(10, 8, 40, 0.38), 0 0 0 1px rgba(0, 0, 0, 0.16), 0 0 0 1.5px rgba(255, 255, 255, 0.06) inset; }
      .d .win { box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1); }
      .side { position: absolute; left: 0; top: 0; width: 232px; height: 900px; overflow: hidden; }
      .panel { position: absolute; left: 232px; top: 8px; width: 1320px; height: 884px; overflow: hidden; background: var(--pn); border: 1px solid var(--ln); border-radius: 8px; }
      .lights { height: 44px; display: flex; align-items: center; gap: 8px; padding-left: 14px; }
      .lights i { display: block; width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.18); }
      .ws { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 16px; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--tx); }
      .ws > .ic { color: var(--tx3); }
      .tile { display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 5px; color: #fff; font-size: 10px; font-weight: 700; flex: none; }
      .ib { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--tx3); flex: none; }
      .si { display: flex; align-items: center; gap: 8px; height: 28px; margin: 0 8px; padding: 0 8px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--tx2); white-space: nowrap; }
      .si > .ic { color: var(--tx3); }
      .si.on { background: var(--hov); color: var(--tx); }
      .si.on > .ic { color: var(--tx2); }
      .si b { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--tx3); }
      .si.ask { color: var(--ac); font-weight: 600; }
      .si.ask > .ic { color: var(--ac); }
      .si .dotc { width: 8px; height: 8px; border-radius: 3px; margin: 0 4px; flex: none; }
      .sh { height: 28px; margin: 14px 8px 0; padding: 0 8px; display: flex; align-items: center; font-size: 12px; font-weight: 500; color: var(--tx3); }
      .foot { position: absolute; left: 0; bottom: 0; width: 232px; height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 12.5px; font-weight: 500; color: var(--tx2); }

      .hd { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 16px; border-bottom: 1px solid var(--ln); font-size: 13px; font-weight: 600; color: var(--tx); white-space: nowrap; }
      .hd .mu { color: var(--tx3); font-weight: 500; }
      .hd > .ic { color: var(--tx3); }
      .btn { height: 28px; padding: 0 11px; display: flex; align-items: center; gap: 6px; border-radius: 6px; font-size: 12.5px; font-weight: 600; background: var(--acb); color: #fff; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1); white-space: nowrap; flex: none; }
      .btn2 { height: 28px; padding: 0 11px; display: flex; align-items: center; gap: 6px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--tx); border: 1px solid var(--ln); background: var(--chip); white-space: nowrap; flex: none; }
      .chip { height: 24px; padding: 0 8px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--ln); border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--tx2); background: var(--chip); white-space: nowrap; flex: none; }
      .chip .mu { color: var(--tx3); font-weight: 400; }
      .kbd { display: inline-flex; align-items: center; height: 18px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--ln); font-size: 11px; font-weight: 500; color: var(--tx3); background: var(--pn2); }
      .stack { display: flex; }
      .stack .av { margin-left: -6px; box-shadow: 0 0 0 2px var(--pn); }
      .stack .av:first-child { margin-left: 0; }
      .av { display: flex; align-items: center; justify-content: center; border-radius: 50%; font-weight: 600; color: #fff; flex: none; }
      .lb { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border: 1px solid var(--ln); border-radius: 10px; font-size: 11.5px; font-weight: 500; color: var(--tx2); white-space: nowrap; flex: none; }
      .lb i { display: block; width: 7px; height: 7px; border-radius: 50%; }
      .tabs { display: flex; gap: 4px; }
      .tab { height: 26px; padding: 0 10px; display: flex; align-items: center; gap: 6px; border-radius: 6px; font-size: 12.5px; font-weight: 500; color: var(--tx3); border: 1px solid transparent; }
      .tab.on { background: var(--sel); border-color: var(--ln); color: var(--tx); }
      .rel { position: relative; }

      /* ---------- docs ---------- */
      .dwrap { position: absolute; left: 0; top: 46px; right: 0; bottom: 0; display: flex; }
      .dcol { width: 960px; overflow: hidden; position: relative; }
      .dtool { height: 40px; display: flex; align-items: center; gap: 2px; padding: 0 20px; border-bottom: 1px solid var(--ln); color: var(--tx2); }
      .dpage { position: absolute; left: 130px; top: 70px; width: 720px; color: var(--tx2); }
      .dpage h1 { font-size: 40px; line-height: 48px; font-weight: 700; letter-spacing: -0.02em; color: var(--tx); margin: 16px 0 12px; }
      .dpage h2 { font-size: 21px; line-height: 28px; font-weight: 650; letter-spacing: -0.01em; color: var(--tx); margin: 28px 0 10px; }
      .dpage p, .dpage li { font-size: 15px; line-height: 24px; color: var(--tx2); }
      .dpage ul { margin: 0 0 0 4px; list-style: none; }
      .dpage li { position: relative; padding-left: 20px; margin-bottom: 6px; }
      .dpage li::before { content: ""; position: absolute; left: 4px; top: 10px; width: 5px; height: 5px; border-radius: 50%; background: var(--tx3); }
      .props { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 13px; color: var(--tx3); align-items: center; }
      .props b { color: var(--tx); font-weight: 500; margin-left: 4px; display: inline-flex; align-items: center; gap: 6px; }
      .props .pr { display: flex; align-items: center; gap: 6px; }
      .tbl { border: 1px solid var(--ln); border-radius: 8px; overflow: hidden; font-size: 13.5px; }
      .tbl .tr { display: flex; align-items: center; height: 38px; border-bottom: 1px solid var(--ln); }
      .tbl .tr:last-child { border-bottom: 0; }
      .tbl .tr.h { height: 32px; background: var(--pn2); font-size: 12px; font-weight: 500; color: var(--tx3); }
      .tbl .tr > div { padding: 0 12px; white-space: nowrap; overflow: hidden; }
      .ck { display: flex; align-items: flex-start; gap: 10px; font-size: 15px; line-height: 24px; color: var(--tx2); margin-bottom: 6px; }
      .ck .bx { width: 17px; height: 17px; margin-top: 3px; border-radius: 5px; border: 1.5px solid var(--tx3); display: flex; align-items: center; justify-content: center; color: #fff; flex: none; }
      .ck.dn .bx { background: var(--acb); border-color: var(--acb); }
      .ck.dn .tx { color: var(--tx3); text-decoration: line-through; }
      .mn { color: var(--ac); background: var(--acbg); border-radius: 4px; padding: 0 4px; font-weight: 500; }
      .hl { background: var(--acbg); border-bottom: 2px solid var(--ac); }
      .rail { width: 360px; border-left: 1px solid var(--ln); background: var(--pn2); padding: 16px 16px; overflow: hidden; }
      .rail .rh { display: flex; align-items: center; font-size: 12px; font-weight: 600; color: var(--tx); margin-bottom: 12px; gap: 6px; }
      .cm { background: var(--pn); border: 1px solid var(--ln); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
      .cm .who { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--tx); }
      .cm .who span { font-weight: 400; color: var(--tx3); font-size: 11.5px; }
      .cm p { font-size: 13px; line-height: 19px; color: var(--tx2); margin-top: 7px; }
      .cm .qt { font-size: 12px; color: var(--tx3); border-left: 2px solid var(--ac); padding-left: 8px; margin-top: 8px; line-height: 17px; }

      /* ---------- inbox ---------- */
      .ibx { position: absolute; left: 0; top: 46px; right: 0; bottom: 0; display: flex; }
      .ml { width: 470px; border-right: 1px solid var(--ln); overflow: hidden; }
      .mlh { height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 14px; border-bottom: 1px solid var(--ln); }
      .mr { display: flex; gap: 11px; height: 66px; padding: 10px 14px; border-bottom: 1px solid var(--ln); position: relative; }
      .mr.sel { background: var(--acbg); }
      .mr.sel::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--ac); }
      .mr .m { min-width: 0; flex: 1; }
      .mr .l1 { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--tx); }
      .mr.rd .l1 { font-weight: 500; color: var(--tx2); }
      .mr .l1 .tm { margin-left: auto; font-size: 11.5px; font-weight: 400; color: var(--tx3); }
      .mr .l2 { font-size: 12.5px; font-weight: 500; color: var(--tx); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
      .mr.rd .l2 { font-weight: 400; color: var(--tx2); }
      .mr .l3 { font-size: 12px; color: var(--tx3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
      .ud { width: 7px; height: 7px; border-radius: 50%; background: var(--ac); flex: none; }
      .rd2 { flex: 1; padding: 0 40px 0 44px; min-width: 0; position: relative; }
      .rd2 .ac { height: 44px; display: flex; align-items: center; gap: 2px; margin: 0 -8px; color: var(--tx3); }
      .rd2 h3 { font-size: 26px; line-height: 32px; font-weight: 650; letter-spacing: -0.015em; color: var(--tx); margin: 14px 0 16px; }
      .snd { display: flex; align-items: center; gap: 11px; margin-bottom: 18px; }
      .snd .n { font-size: 13.5px; font-weight: 600; color: var(--tx); }
      .snd .e { font-size: 12px; color: var(--tx3); margin-top: 1px; }
      .snd .t { margin-left: auto; font-size: 12px; color: var(--tx3); }
      .bd p { font-size: 14.5px; line-height: 23px; color: var(--tx2); margin-bottom: 12px; }
      .att { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px 0 12px; margin: 4px 10px 0 0; border: 1px solid var(--ln); border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--tx); background: var(--pn2); }
      .att span { color: var(--tx3); font-weight: 400; font-size: 12px; }
      .sum { border: 1px solid rgba(91, 91, 240, 0.4); background: var(--acbg); border-radius: 10px; padding: 12px 14px; margin: 0 0 18px; }
      .sum .sh2 { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ac); margin-bottom: 5px; }
      .sum p { font-size: 13.5px; line-height: 20px; color: var(--tx); margin: 0; }
      .rep { position: absolute; left: 44px; right: 40px; bottom: 22px; height: 76px; border: 1px solid var(--ln); border-radius: 10px; background: var(--pn2); padding: 14px 16px; font-size: 13.5px; color: var(--tx3); display: flex; align-items: flex-start; gap: 8px; }

      /* ---------- board ---------- */
      .vbar { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 16px; border-bottom: 1px solid var(--ln); }
      .kbody { position: absolute; left: 0; top: 92px; right: 0; bottom: 0; background: var(--pn2); overflow: hidden; }
      .kcol { position: absolute; top: 14px; width: 300px; }
      .kch { height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 6px; font-size: 13px; font-weight: 600; color: var(--tx); }
      .kch .ct { font-size: 12px; font-weight: 500; color: var(--tx3); }
      .kc { position: absolute; width: 300px; height: 106px; padding: 11px 12px; border-radius: 9px; background: var(--pn); border: 1px solid var(--ln); box-shadow: 0 1px 2px rgba(20, 20, 40, 0.05); }
      .kt { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--tx3); }
      .kh { margin-top: 7px; font-size: 13.5px; line-height: 18px; font-weight: 500; color: var(--tx); height: 36px; overflow: hidden; }
      .kb { display: flex; align-items: center; gap: 6px; margin-top: 9px; }
      .kd { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--tx3); }

      /* ---------- meeting ---------- */
      .mt { position: absolute; left: 0; top: 46px; right: 0; bottom: 0; display: flex; }
      .tr1 { flex: 1; min-width: 0; padding: 18px 28px 0 28px; border-right: 1px solid var(--ln); overflow: hidden; }
      .wv { height: 120px; position: relative; margin-bottom: 8px; }
      .wl { position: absolute; left: 76px; right: 0; height: 30px; }
      .wn { position: absolute; left: 0; height: 30px; display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 500; color: var(--tx2); }
      .trl { display: flex; gap: 12px; padding: 12px 12px; border-radius: 9px; margin: 0 -12px 2px; }
      .trl.on { background: var(--acbg); box-shadow: inset 2px 0 0 var(--ac); }
      .trl .tt { width: 40px; font-size: 12px; color: var(--tx3); padding-top: 3px; flex: none; }
      .trl .nm { font-size: 12.5px; font-weight: 600; color: var(--tx); margin-bottom: 3px; }
      .trl p { font-size: 15px; line-height: 23px; color: var(--tx2); }
      .trl .nm span { font-weight: 400; color: var(--tx3); margin-left: 6px; }
      .sm { width: 450px; padding: 18px 22px; overflow: hidden; background: var(--pn2); }
      .sm h4 { font-size: 12px; font-weight: 600; color: var(--tx3); letter-spacing: 0.02em; margin: 18px 0 8px; display: flex; align-items: center; gap: 6px; }
      .sm h4:first-child { margin-top: 0; }
      .sm p { font-size: 14px; line-height: 21px; color: var(--tx); }
      .sm .ai { color: var(--ac); }
      .it { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--ln); font-size: 13.5px; line-height: 19px; color: var(--tx); }
      .it .bx { width: 16px; height: 16px; margin-top: 1px; border-radius: 5px; border: 1.5px solid var(--tx3); flex: none; display: flex; align-items: center; justify-content: center; color: #fff; }
      .it .bx.dn { background: var(--acb); border-color: var(--acb); }
      .it small { display: block; font-size: 11.5px; color: var(--tx3); margin-top: 2px; }

      /* ---------- calendar ---------- */
      .cwrap { position: absolute; left: 0; top: 46px; right: 0; bottom: 0; }
      .cdh { position: absolute; left: 0; top: 0; right: 0; height: 56px; display: flex; border-bottom: 1px solid var(--ln); }
      .cdh div { flex: 1; padding: 10px 12px 0; font-size: 11.5px; font-weight: 500; color: var(--tx3); letter-spacing: 0.04em; }
      .cdh div b { display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; border-radius: 13px; font-size: 16px; font-weight: 600; color: var(--tx); letter-spacing: 0; margin-left: 6px; }
      .cdh div.td { color: var(--ac); }
      .cdh div.td b { background: var(--acb); color: #fff; }
      .cgrid { position: absolute; left: 0; top: 56px; right: 0; bottom: 0; overflow: hidden; }
      .cgrid .hl2 { position: absolute; left: 56px; right: 0; height: 1px; background: var(--ln); }
      .cgrid .vl { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ln); }
      .cgrid .hr { position: absolute; left: 0; width: 50px; text-align: right; font-size: 11px; color: var(--tx3); }
      .ev { position: absolute; padding: 4px 8px; border-left: 3px solid; border-radius: 5px; font-size: 12px; font-weight: 600; line-height: 15px; overflow: hidden; }
      .ev span { display: block; font-weight: 500; opacity: 0.75; font-size: 11px; }
      .nowl { position: absolute; left: 56px; right: 0; height: 2px; background: #ee5a4f; z-index: 3; }
      .nowl em { position: absolute; left: -52px; top: -9px; font-style: normal; font-size: 10.5px; font-weight: 600; color: #fff; background: #ee5a4f; border-radius: 4px; padding: 2px 5px; }
      .pop { position: absolute; z-index: 5; width: 330px; border-radius: 12px; background: var(--pn); border: 1px solid var(--ln); box-shadow: 0 18px 50px rgba(20, 20, 50, 0.22); padding: 16px 18px; }
      .pop .t { font-size: 17px; font-weight: 650; color: var(--tx); letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }

        F(id + " .cam", c[3], Object.assign({ duration: c[2], ease: P3 }, c[4]), c[1]);
        F(id + " .win", { filter: "blur(" + c[5] / c[3].scale + "px)" }, { filter: "blur(" + c[6] / c[4].scale + "px)", duration: 0.3, ease: "power2.out" }, c[1]);
        const w = document.querySelector(id + " .word span");
        if (w) F(id + " .word span", { scale: 1.08, filter: "blur(10px)" }, { scale: 1, filter: "blur(0px)", duration: 0.28, ease: EXPO }, c[1]);
        else F(id + " .cap span", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.22, ease: EXPO }, c[1] + 0.04);
      });

      /* ---------- end card: the full line, slow push ---------- */
      F("#cardline", { scale: 1 }, { scale: 1.035, duration: 1.8, ease: "none" }, 6.8);
      F("#cardline div:nth-child(1)", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: EXPO }, 6.8);
      F("#cardline div:nth-child(2)", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: EXPO }, 6.88);

      /* ---------- lockup: four tiles settle, wordmark unfolds, slow push ---------- */
      gsap.set("#lockrow", { transformOrigin: "960px 540px" });
      F("#ibody", { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.7, ease: EXPO }, 8.6);
      [["#t1", -30, -30], ["#t2", 30, -30], ["#t3", -30, 30], ["#t4", 30, 30]].forEach((t, i) => {
        F(t[0], { opacity: 0, x: t[1], y: t[2], scale: 0.5 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.8, ease: EXPO }, 8.68 + i * 0.07);
      });
      F("#wm .lt", { opacity: 0, x: -60, filter: "blur(10px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.9, ease: EXPO, stagger: 0.05 }, 8.65);
      F("#tag", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3, ease: EXPO }, 8.6);
      F("#lockrow", { scale: 1 }, { scale: 1.04, duration: 2.2, ease: "none" }, 8.6);

      tl.set({}, {}, 10.8);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
