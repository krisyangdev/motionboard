<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #1b1b1f;
        --sub: #40414a;
        --mut: #4d4e56;
        --line: #e7e6e3;

      .row.sel .m { color: #3b3c43; }

      /* editor */
      #ed { position: absolute; left: 600px; top: 0; width: 590px; height: 900px; background: #fff; }

      .ge { fill: none; stroke: #bdbec5; stroke-width: 1.2; stroke-linecap: round; }
      .ge.m { stroke: var(--brand); stroke-width: 1.6; }

      /* hover card and cursor */
      #hov { position: absolute; left: 880px; top: 428px; width: 330px; height: 128px; border-radius: 12px; background: #fff; opacity: 0; z-index: 12;

      .qt { position: absolute; left: 54px; top: 18px; font-size: 18px; line-height: 24px; letter-spacing: -0.005em; white-space: nowrap; }

      .fc.on { background: #1b1b1f; border-color: #1b1b1f; color: #fff; }

      #ans .al { position: absolute; left: 16px; top: 14px; display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--brandInk); }

      #ans .sr { position: absolute; left: 16px; top: 112px; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--sub); opacity: 0; white-space: nowrap; }
      #ans .sr b { font-weight: 500; color: #2b2b31; background: #fff; border: 1px solid #cde8db; border-radius: 6px; padding: 2px 8px; display: flex; align-items: center; gap: 5px; }

      .pr.sel { background: var(--tint); }

      .pr .t { position: absolute; left: 44px; top: 9px; font-size: 14px; line-height: 19px; font-weight: 600; white-space: nowrap; }

      #foot span { display: flex; align-items: center; gap: 6px; }

      #endSub { position: absolute; left: 0; top: 520px; width: 1920px; text-align: center; font-size: 32px; line-height: 40px; font-weight: 500; letter-spacing: -0.012em; color: #7a7b83; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11" data-width="1920" data-height="1080">
      <div id="stage" class="clip full" data-start="0" data-duration="11" data-track-index="0">
        <div id="drift" class="full" data-layout-allow-overlap>
          <div id="cam" class="full" data-layout-allow-overlap>
            <div id="persp" class="full" data-layout-allow-overlap>
              <div id="world" class="full" data-layout-allow-overlap>
                <div id="hplane" class="full" data-layout-allow-overlap>
                  <div id="h1" class="hw" data-layout-allow-occlusion data-layout-allow-overflow>Capture</div>
                  <div id="h2" class="hw" data-layout-allow-occlusion data-layout-allow-overflow>Connect</div>
                  <div id="h3" class="hw" data-layout-allow-occlusion data-layout-allow-overflow>Recall</div>
                  <div id="h4" class="hw" data-layout-allow-occlusion data-layout-allow-overflow>Halden</div>
                </div>
                <div id="win" data-layout-allow-overlap></div>
              </div>
            </div>
            <div id="endIcon" data-layout-allow-overlap>

                <rect width="100" height="100" rx="23" fill="url(#ig)"/>
                <rect x="29" y="24" width="12" height="52" rx="6" fill="#fff"/>
                <rect x="59" y="24" width="12" height="52" rx="6" fill="#fff"/>
                <rect x="29" y="44" width="42" height="12" rx="6" fill="#fff"/>
              </svg>
            </div>
            <div id="endSub">Notes that remember.</div>
          </div>
        </div>
      </div>
      <div id="vig" class="clip full" data-start="0" data-duration="11" data-track-index="1"></div>
    </div>

    <script>
      const EIO = "power3.inOut";

      function wordOut(id, at) {
        tl.to(id, { y: 230, duration: 0.3, ease: "power3.in" }, at);
        tl.set(id, { opacity: 0 }, at + 0.31);
      }
      function wordIn(id, at, dur) {
        F(id, { opacity: 1, y: 230 }, { opacity: 1, y: 0, duration: dur || 0.9, ease: EXPO }, at);
      }

      /* slow world rotation: the headline drifts against the window all film long */
      F("#world", { rotateY: -4 }, { rotateY: 4, duration: 11, ease: "none" }, 0);
      F("#drift", { scale: 1 }, { scale: 1.03, duration: 11, ease: "none" }, 0);

      /* 1. headline in, opaque window rises over it (0 - 1.45) */
      gsap.set("#win", { y: 800, rotateX: 10 });
      F("#h1", { y: 40 }, { y: 0, duration: 1.2, ease: EXPO }, 0);
      F("#win", { y: 800, rotateX: 10 }, { y: 0, rotateX: 0, duration: 1.15, ease: EXPO }, 0.3);

      /* 2. type a new bullet, tick a task, drop in a web clip (1.4 - 2.9) */
      tl.set("#car", { opacity: 1 }, 1.0);
      typeTimes(BUL.length, 1.45, 0.95).forEach((t, i) => tl.set("#bc" + i, { display: "inline" }, t));
      tl.set("#car", { opacity: 0 }, 2.5);
      tl.set("#cb3", { backgroundColor: "#0f9d68", borderColor: "#0f9d68" }, 2.5);
      F("#cb3 svg", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.25, ease: BACK }, 2.5);
      tl.set("#tx3", { color: "#4d4e56", textDecoration: "line-through" }, 2.5);
      F("#clipc", { opacity: 0, y: 10, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: EXPO }, 2.62);

      /* 3. Capture -> Connect: the old word is fully behind the window at 3.3, then the new one rises (3.0 - 4.6) */
      const D = 3.32;
      wordOut("#h1", 3.0);
      wordIn("#h2", D);
      camMove(FULL, ZB, D, 0.7, 3);
      tl.to("#pA", { opacity: 0, duration: 0.25, ease: "power2.out" }, D);
      F("#pB", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, D + 0.05);
      const links = document.querySelectorAll("#ed .lk");
      links.forEach((el, i) => {
        tl.to(el, { color: "#07603f", backgroundColor: "rgba(15,157,104,0.12)", duration: 0.25, ease: "power2.out" }, D + 0.1 + i * 0.1);
      });
      ["e1", "e2", "e3", "e4", "e5", "e6", "e7", "e8", "e9", "e10"].forEach((id, i) => {
        tl.to("#" + id, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, D + 0.2 + i * 0.07);
      });
      for (let i = 1; i <= 6; i++) F("#n" + i + (i < 5 ? ", #t" + i : ""), { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, D + 0.2 + i * 0.08);
      F("#t5", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, D + 0.75);
      for (let i = 7; i <= 10; i++) F("#n" + i, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, D + 0.7 + (i - 7) * 0.06);
      F("#n0, #n0r", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, D + 0.1);
      gsap.utils.toArray(".bkr").forEach((el, i) => F(el, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: EXPO }, D + 0.45 + i * 0.09));
      gsap.utils.toArray(".ogr").forEach((el, i) => F(el, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: EXPO }, D + 0.8 + i * 0.08));

      /* 4. cursor hovers a link, the hover card and the graph node light together (4.05 - 5.3) */
      F("#cur", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, 4.05);
      F("#cur", { x: 1120, y: 560 }, { x: 1000, y: 404, duration: 0.55, ease: "power2.inOut" }, 4.1);
      F("#hov", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: EXPO }, 4.7);
      F("#n1r", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: EXPO }, 4.7);
      tl.to("#e1", { strokeWidth: 2.4, duration: 0.3, ease: "power2.out" }, 4.7);
      tl.to("#hov", { opacity: 0, y: 4, duration: 0.25, ease: "power2.in" }, 5.3);
      tl.to("#n1r", { opacity: 0, duration: 0.25, ease: "power2.in" }, 5.3);
      tl.to("#cur", { opacity: 0, duration: 0.25, ease: "power2.in" }, 5.3);

      /* 5. Connect -> Recall: the palette opens on the same frame as the new word (5.5 - 8.3) */
      const R = 5.82;
      wordOut("#h2", 5.5);
      wordIn("#h3", R);
      camMove(ZB, ZC, R, 0.7, 3);
      F("#dim", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, R);
      F("#pal", { opacity: 0, y: 14, scale: 0.965 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: EXPO }, R);
      tl.set("#qph", { opacity: 0 }, 6.15);
      typeTimes(QRY.length, 6.15, 0.75).forEach((t, i) => tl.set("#qc" + i, { display: "inline" }, t));
      tl.set("#qcar", { opacity: 0 }, 6.95);
      tl.set("#rec", { opacity: 0 }, 7.0);
      F("#nlab", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power2.out" }, 7.0);
      F("#ans", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: EXPO }, 7.0);
      gsap.utils.toArray(".prr").forEach((el, i) => F(el, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: EXPO }, 7.05 + i * 0.07));
      const A0 = 7.1, AD = 0.65;
      for (let i = 0; i < AW; i++) tl.set("#aw" + i, { opacity: 1 }, A0 + (i / AW) * AD);
      [1, 2, 3].forEach((c) => tl.set("#cs" + c, { opacity: 1 }, A0 + (citeAt[c] / AW) * AD + 0.02));
      F("#asrc", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 7.8);

      /* 6. Recall -> Halden: palette closes, window sinks, camera pulls back (8.3 - 9.4) */
      tl.to("#pal", { opacity: 0, y: 8, duration: 0.25, ease: "power2.in" }, 8.3);
      tl.to("#dim", { opacity: 0, duration: 0.3, ease: "power2.in" }, 8.35);
      wordOut("#h3", 8.2);
      wordIn("#h4", 8.52, 0.9);
      tl.to("#win", { y: 210, duration: 1.0, ease: EIO }, 8.45);
      camMove(ZC, FULL, 8.3, 0.9, 2);
      F("#endIcon", { opacity: 0, y: 10, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: EXPO }, 8.75);
      F("#endSub", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.55, ease: EXPO }, 9.1);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
