<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --base: #040405;
        --ink: #f2f3f5;
        --muted: #8b8f98;
        --accent: #2dd4bf;
        --font-ui: "Inter", -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--base); }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--base);
        font-family: var(--font-ui); color: var(--ink); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
      }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      svg { display: block; flex: none; }

      /* ---------- camera and world ---------- */
      #stage { z-index: 1; overflow: hidden; }
      #cam1 { position: absolute; left: 960px; top: 540px; width: 0; height: 0; }
      #cam2, #cam3 { position: absolute; left: 0; top: 0; width: 0; height: 0; }
      .lg { position: absolute; left: 0; top: 0; width: 0; height: 0; }

      /* ---------- laptop, seen from behind: lid back with the mark ---------- */
      .body { position: absolute; left: -190px; top: 0; width: 380px; height: 268px; }
      .pool {
        position: absolute; left: -130px; top: 235px; width: 640px; height: 210px; opacity: 0; pointer-events: none;
        background: radial-gradient(ellipse 50% 50% at 50% 30%, rgba(140,235,222,0.20) 0%, rgba(140,235,222,0.06) 55%, rgba(0,0,0,0) 100%);
      }
      .fsh {
        position: absolute; left: 10px; top: 255px; width: 360px; height: 30px; pointer-events: none; filter: blur(8px);
        background: radial-gradient(ellipse at 50% 20%, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.55) 50%, rgba(0,0,0,0) 74%);
      }
      .base {
        position: absolute; left: 3px; top: 255px; width: 374px; height: 11px; border-radius: 0 0 9px 9px / 0 0 6px 6px;
        background:
          linear-gradient(90deg, rgba(0,0,0,0.30) 0, rgba(0,0,0,0) 5%, rgba(0,0,0,0) 95%, rgba(0,0,0,0.30) 100%),
          linear-gradient(180deg, #17181b 0, #2b2d31 2px, #8d9097 4px, #c4c7cc 7px, #9a9da4 10px, #5d6067 100%);
        box-shadow: inset 0 -1px 0 rgba(255,255,255,0.55), 0 1px 0 rgba(0,0,0,0.7);
      }
      .lid {
        position: absolute; left: 0; top: 0; width: 380px; height: 268px; border-radius: 14px 14px 9px 9px / 14px 14px 12px 12px; overflow: hidden;
        clip-path: polygon(1.6% 0, 98.4% 0, 100% 100%, 0 100%);
        transform-origin: 50% 0;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0) 28%, rgba(0,0,0,0.14) 100%),
          linear-gradient(112deg, #85888f 0%, #bfc2c8 26%, #a4a7ae 48%, #d0d2d7 68%, #8a8d94 100%);
        box-shadow: inset 0 2px 0 rgba(255,255,255,0.95), inset 0 0 0 1px rgba(255,255,255,0.5), inset 0 0 0 3px rgba(0,0,0,0.10), inset 0 -3px 5px rgba(0,0,0,0.30), inset 3px 0 4px rgba(255,255,255,0.18), inset -3px 0 4px rgba(0,0,0,0.26);
      }
      .lid::after {
        content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 44px;
        background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.14) 50%, rgba(0,0,0,0.34) 78%, rgba(0,0,0,0.52) 100%);
      }
      .hg {
        position: absolute; left: 3px; top: 259px; width: 374px; height: 6px; pointer-events: none; filter: blur(0.7px);
        background: linear-gradient(180deg, rgba(0,0,0,0) 0, rgba(0,0,0,0.5) 38%, rgba(0,0,0,0.8) 62%, rgba(0,0,0,0) 100%);
      }
      .lip {
        position: absolute; left: 0; top: 0; width: 380px; height: 4px; z-index: 2;
        background: linear-gradient(180deg, #ffffff 0, rgba(255,255,255,0.55) 2px, rgba(255,255,255,0) 4px);
      }
      .lid::before {
        content: ""; position: absolute; inset: 0;
        background: repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, rgba(0,0,0,0.022) 1px 3px);
      }
      .spec {
        position: absolute; left: -200px; top: -40px; width: 240px; height: 360px;
        background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.30) 50%, rgba(255,255,255,0) 100%);
        transform: skewX(-12deg);
      }
      .mk { position: absolute; left: 154px; top: 100px; width: 72px; height: 72px; }
      .mkg { opacity: 0; filter: drop-shadow(0 0 10px #2dd4bf) drop-shadow(0 0 28px rgba(45,212,191,0.8)); }
      .edge {
        position: absolute; left: 10px; top: -2px; width: 360px; height: 3px; border-radius: 2px; opacity: 0;
        background: linear-gradient(90deg, rgba(190,255,248,0) 0%, #d8fffa 20%, #ffffff 50%, #d8fffa 80%, rgba(190,255,248,0) 100%);
        box-shadow: 0 0 22px 4px rgba(120, 240, 225, 0.65);
      }

      /* ---------- beam: window onto a screen-space UI layer ---------- */
      .bm {
        --a: 170; --b: 170; --L: 0; --k: 0; --t: 0;
        position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0;
      }
      .win, .rim, .glow {
        position: absolute; left: -1600px; top: -2400px; width: 3200px; height: 2400px;
      }
      .win {
        clip-path: polygon(
          calc(1600px - var(--a) * 1px) 2400px,
          calc(1600px + var(--a) * 1px) 2400px,
          calc(1600px + var(--b) * 1px + var(--L) * var(--t) * 1px) calc(2400px - var(--L) * 1px + var(--k) * 1px),
          calc(1600px - var(--b) * 1px + var(--L) * var(--t) * 1px) calc(2400px - var(--L) * 1px - var(--k) * 1px));
        background: #0a0b0d;
      }
      .rim {
        clip-path: polygon(
          calc(1600px - var(--a) * 1px - 3px) 2400px,
          calc(1600px + var(--a) * 1px + 3px) 2400px,
          calc(1600px + var(--b) * 1px + var(--L) * var(--t) * 1px + 3px) calc(2400px - var(--L) * 1px + var(--k) * 1px - 3px),
          calc(1600px - var(--b) * 1px + var(--L) * var(--t) * 1px - 3px) calc(2400px - var(--L) * 1px - var(--k) * 1px - 3px));
        background: linear-gradient(to top, rgba(220,255,250,0.95) 0, rgba(220,255,250,0.35) 1000px, rgba(220,255,250,0.3) 2400px);
      }
      .glow { filter: blur(40px); }
      .glow i {
        position: absolute; left: 0; top: 0; width: 3200px; height: 2400px; display: block;
        clip-path: polygon(
          calc(1600px - var(--a) * 1px - 60px) 2400px,
          calc(1600px + var(--a) * 1px + 60px) 2400px,
          calc(1600px + var(--b) * 1px + var(--L) * var(--t) * 1px + 60px) calc(2400px - var(--L) * 1px + var(--k) * 1px - 60px),
          calc(1600px - var(--b) * 1px + var(--L) * var(--t) * 1px - 60px) calc(2400px - var(--L) * 1px - var(--k) * 1px - 60px));
        background: linear-gradient(to top, rgba(110,235,220,0.08) 0, rgba(110,235,220,0.02) 900px, rgba(110,235,220,0) 1800px);
      }
      .pc { position: absolute; left: 1600px; top: 2400px; width: 0; height: 0; }
      .pc .pc { left: 0; top: 0; }
      .shade {
        position: absolute; left: 0; top: 0; width: 3200px; height: 2400px; pointer-events: none;
        background: linear-gradient(to top, rgba(0,0,0,0) 0, rgba(0,0,0,0.12) 300px, rgba(0,0,0,0.5) 1100px, rgba(0,0,0,0.5) 2400px);
      }
      .bloom {
        position: absolute; left: 1180px; top: 2060px; width: 840px; height: 340px; mix-blend-mode: screen; pointer-events: none;
        background: radial-gradient(ellipse at 50% 100%, rgba(200,255,248,0.5) 0%, rgba(200,255,248,0.133) 38%, rgba(200,255,248,0) 70%);
      }

      /* ---------- screens ---------- */
      .pn {
        position: absolute; left: -640px; top: -740px; width: 1280px; height: 800px; overflow: hidden;
        transform-origin: 640px 800px; font-size: 13px; color: #c5c8d0;
      }
      .ic { flex: none; display: block; }
      .row { display: flex; align-items: center; }
      .grow { flex: 1; min-width: 0; }
      .nw { white-space: nowrap; }
      .mbar {
        position: absolute; left: 0; top: 0; width: 1280px; height: 26px; display: flex; align-items: center; gap: 18px; padding: 0 14px;
        font-size: 12.5px; font-weight: 500; z-index: 3;
      }
      .mbar b { font-weight: 700; }
      .mbar .r { margin-left: auto; display: flex; align-items: center; gap: 12px; }
      .win2 { position: absolute; left: 0; top: 26px; width: 1280px; height: 774px; display: flex; flex-direction: column; }
      .tbar { height: 38px; flex: none; display: flex; align-items: center; padding: 0 14px; position: relative; }
      .tl3 { display: flex; gap: 8px; }
      .tl3 i { display: block; width: 12px; height: 12px; border-radius: 50%; }
      .tbar .ttl { position: absolute; left: 0; right: 0; text-align: center; font-size: 12.5px; font-weight: 500; }
      .kb {
        display: inline-flex; align-items: center; justify-content: center; height: 18px; min-width: 18px; padding: 0 5px;
        border-radius: 5px; font-size: 11px; font-weight: 500;
      }
      .av { display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 600; flex: none; }

      /* A: editor */
      .pa { background: #131417; }
      .pa .mbar { background: #0b0c0e; color: #d6d8de; }
      .pa .win2 { background: #17181c; }
      .pa .tbar { background: #1b1c20; border-bottom: 1px solid #0e0f11; color: #9a9ea8; }
      .pa .tl3 i { background: #3a3c42; }
      .abody { flex: 1; min-height: 0; display: flex; }
      .act { width: 48px; flex: none; background: #121316; border-right: 1px solid #0e0f11; display: flex; flex-direction: column; align-items: center; padding-top: 10px; gap: 4px; color: #6f737c; }
      .act > div { width: 48px; height: 44px; display: flex; align-items: center; justify-content: center; position: relative; }
      .act > div.on { color: #e6e8ee; }
      .act > div.on::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; background: var(--accent); }
      .exp { width: 236px; flex: none; background: #15161a; border-right: 1px solid #0e0f11; overflow: hidden; }
      .exp .h { height: 34px; display: flex; align-items: center; padding: 0 14px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #8b8f98; }
      .exp .t { height: 24px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #b6bac3; white-space: nowrap; }
      .exp .t.on { background: #23252b; color: #f0f2f6; }
      .exp .t .ic { color: #7b7f89; }
      .exp .t.d { color: #d3d6dd; }
      .amain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .atabs { height: 34px; flex: none; display: flex; background: #131417; border-bottom: 1px solid #0e0f11; }
      .atab { display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: 13px; color: #8b8f98; border-right: 1px solid #0e0f11; white-space: nowrap; }
      .atab.on { background: #1c1d22; color: #eef0f4; box-shadow: inset 0 1px 0 var(--accent); }
      .atab .ts { font-size: 9.5px; font-weight: 700; color: #4aa3f0; }
      .crumb { height: 24px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 16px; font-size: 12px; color: #7b7f89; background: #1c1d22; }
      .edit { flex: 1; min-height: 0; position: relative; overflow: hidden; background: #1c1d22; }
      .code { position: absolute; left: 0; top: -180px; width: 900px; font-family: var(--font-mono); font-size: 13px; line-height: 20px; }
      .ln { display: flex; height: 20px; white-space: pre; }
      .ln .n { width: 58px; flex: none; text-align: right; padding-right: 20px; color: #565a63; }
      .ln.cur { background: #23252b; }
      .ln.cur .n { color: #c9ccd3; }
      .ln .tx { color: #d4d7de; }
      .k { color: #c084fc; } .s { color: #86d9a0; } .f { color: #6cb6ff; } .nn { color: #f4a261; } .c { color: #5f6570; font-style: italic; } .ty { color: #f2cc6b; }
      .ghost { opacity: 0.38; }
      .caret { display: inline-block; width: 2px; height: 16px; margin-left: 1px; vertical-align: -3px; background: #e8eaee; }
      .gpill {
        position: absolute; left: 300px; top: 322px; height: 24px; opacity: 0; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 6px;
        background: #2a2c33; border: 1px solid #3a3d46; font-size: 11.5px; color: #c5c8d0; font-family: var(--font-ui); box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      }
      .gpill .kb { background: #3a3d46; color: #e8eaee; }
      .mini { position: absolute; right: 0; top: 0; width: 96px; bottom: 0; background: #1c1d22; border-left: 1px solid #17181c; }
      .mini i { position: absolute; height: 2px; border-radius: 1px; opacity: 0.55; }
      .term { height: 170px; flex: none; background: #17181c; border-top: 1px solid #0e0f11; }
      .term .tt { white-space: nowrap; height: 28px; display: flex; align-items: center; gap: 22px; padding: 0 16px; font-size: 11px; font-weight: 500; letter-spacing: 0.04em; color: #7b7f89; }
      .term .tt .on { color: #eef0f4; box-shadow: inset 0 -1px 0 var(--accent); height: 28px; display: flex; align-items: center; }
      .term .tb { padding: 6px 16px; font-family: var(--font-mono); font-size: 12.5px; line-height: 19px; color: #c5c8d0; white-space: pre; }
      .tg { color: #2dd4bf; } .tm { color: #7b7f89; } .tw { color: #f2f3f5; font-weight: 700; }
      .tln { opacity: 0; }
      .sbar { height: 24px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 12px; background: #0f766e; color: #e8fffb; font-size: 12px; }
      .sbar .r { margin-left: auto; display: flex; gap: 16px; }
      .sbar > span, .sbar .r > span { display: flex; align-items: center; gap: 5px; }

      /* B: dashboard */
      .pb { background: #ffffff; color: #3b3f47; }
      .pb .mbar { background: #f3f3f5; color: #1c1d21; border-bottom: 1px solid #e3e4e8; }
      .pb .win2 { background: #fff; }
      .pb .tbar { background: #f7f7f9; border-bottom: 1px solid #e6e7ea; color: #6b6f78; }
      .pb .tl3 i:nth-child(1) { background: #ff5f57; } .pb .tl3 i:nth-child(2) { background: #febc2e; } .pb .tl3 i:nth-child(3) { background: #28c840; }
      .bbody { flex: 1; min-height: 0; display: flex; }
      .bside { width: 232px; flex: none; background: #fafafb; border-right: 1px solid #e8e9ec; padding: 12px 10px; display: flex; flex-direction: column; }
      .bws { height: 38px; display: flex; align-items: center; gap: 9px; padding: 0 8px; border-radius: 8px; font-weight: 600; font-size: 13.5px; color: #17181c; margin-bottom: 10px; }
      .bws .sq { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, #2dd4bf, #0f766e); display: flex; align-items: center; justify-content: center; }
      .bnav { height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 7px; font-size: 13px; font-weight: 500; color: #4b4f58; white-space: nowrap; }
      .bnav .ic { color: #7b808a; }
      .bnav b { margin-left: auto; font-weight: 500; font-size: 11.5px; color: #8b909a; }
      .bnav.on { background: #eceef1; color: #101114; }
      .bnav.on .ic { color: #0f766e; }
      .bsh { height: 26px; margin-top: 12px; padding: 0 10px; display: flex; align-items: center; font-size: 11.5px; font-weight: 600; color: #8b909a; }
      .bmain { flex: 1; min-width: 0; padding: 20px 28px 0; }
      .bh { height: 36px; display: flex; align-items: center; gap: 12px; }
      .bh h1 { font-size: 22px; font-weight: 650; letter-spacing: -0.015em; color: #101114; }
      .pill { height: 22px; display: inline-flex; align-items: center; gap: 5px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 500; white-space: nowrap; }
      .btn { height: 30px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 7px; font-size: 12.5px; font-weight: 550; white-space: nowrap; }
      .btn.sec { border: 1px solid #dcdee3; color: #2b2e35; background: #fff; }
      .btn.pri { background: #0f766e; color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.2); }
      .bf { height: 32px; margin-top: 14px; display: flex; align-items: center; gap: 8px; }
      .kpis { margin-top: 16px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
      .kpi { height: 92px; border: 1px solid #e6e7eb; border-radius: 10px; padding: 12px 16px; background: #fff; }
      .kpi .l { font-size: 12px; color: #6b707a; display: flex; align-items: center; gap: 6px; }
      .kpi .v { margin-top: 8px; font-size: 26px; font-weight: 650; letter-spacing: -0.02em; color: #101114; display: flex; align-items: baseline; gap: 10px; }
      .kpi .d { font-size: 12px; font-weight: 550; }
      .up { color: #0f9f6e; } .dn { color: #0f9f6e; }
      .card { margin-top: 16px; border: 1px solid #e6e7eb; border-radius: 10px; background: #fff; height: 250px; position: relative; }
      .card .ch { height: 42px; display: flex; align-items: center; padding: 0 16px; font-size: 13.5px; font-weight: 600; color: #17181c; gap: 14px; }
      .lgd { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: #6b707a; }
      .lgd i { width: 10px; height: 3px; border-radius: 2px; display: block; }
      .tbl { margin-top: 16px; border: 1px solid #e6e7eb; border-radius: 10px; overflow: hidden; height: 250px; }
      .tr { height: 36px; display: flex; align-items: center; padding: 0 16px; border-top: 1px solid #eef0f2; font-size: 12.5px; color: #3b3f47; white-space: nowrap; }
      .tr.h { height: 32px; border-top: 0; background: #f8f8fa; font-size: 11.5px; font-weight: 600; color: #7b808a; }
      .tr > div { flex: none; display: flex; align-items: center; gap: 8px; overflow: hidden; }
      .c1 { width: 80px; } .c2 { width: 270px; } .c3 { width: 170px; } .c4 { width: 110px; } .c5 { width: 120px; } .c6 { width: 110px; }
      .mono { font-family: var(--font-mono); font-size: 12px; }
      .st { display: inline-flex; align-items: center; gap: 6px; font-weight: 550; }
      .st i { width: 7px; height: 7px; border-radius: 50%; display: block; }
      .ok { color: #0f7a55; } .ok i { background: #1fb878; } .er { color: #c2362e; } .er i { background: #e5484d; } .bd { color: #a16207; } .bd i { background: #f5a524; }
      .dim { color: #8b909a; }

      /* C: mail */
      .pc3 { background: #141518; color: #c9ccd3; }
      .pc3 .mbar { background: #0b0c0e; color: #d6d8de; }
      .pc3 .win2 { background: #17181b; }
      .pc3 .tbar { background: #1a1b1f; border-bottom: 1px solid #0e0f11; color: #9a9ea8; }
      .pc3 .tl3 i { background: #3a3c42; }
      .cbody { flex: 1; min-height: 0; display: flex; }
      .cside { width: 224px; flex: none; background: #121316; border-right: 1px solid #0e0f11; padding: 12px 10px; }
      .cnav { height: 31px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 7px; font-size: 13px; font-weight: 500; color: #aeb2bb; white-space: nowrap; }
      .cnav .ic { color: #7b7f89; }
      .cnav b { margin-left: auto; font-weight: 500; font-size: 11.5px; color: #8b8f98; }
      .cnav.on { background: #23252b; color: #f2f3f6; }
      .cnav.on .ic { color: var(--accent); }
      .clist { width: 372px; flex: none; border-right: 1px solid #0e0f11; background: #16171a; overflow: hidden; }
      .clh { height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid #0e0f11; }
      .clh h2 { font-size: 16px; font-weight: 650; color: #f2f3f6; letter-spacing: -0.01em; }
      .mrow { height: 66px; display: flex; gap: 11px; padding: 10px 16px 0 14px; border-bottom: 1px solid #1d1e22; position: relative; }
      .mrow.sel { background: #212329; box-shadow: inset 2px 0 0 var(--accent); }
      .mrow .mt { flex: 1; min-width: 0; }
      .mrow .a { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #e9ebf0; }
      .mrow .a em { margin-left: auto; font-style: normal; font-weight: 450; font-size: 11.5px; color: #7b7f89; }

      tl.to("#toast", { opacity: 0, duration: 0.3, ease: "power1.out" }, 6.3);
      swing(2, -4, 5.5, 0.9, "sine.inOut");
      swing(1, -17, 5.7, 0.7, "sine.inOut");
      swing(3, 18, 5.7, 0.7, "sine.inOut");
      cam(1500, 670, 0.74, -3, 5.5, 0.9, "sine.inOut");

      /* ---- scene 4: one wide cone (6.4 to 8.3) ---- */

      tl.set({}, {}, 11);
