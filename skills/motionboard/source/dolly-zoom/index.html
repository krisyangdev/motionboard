<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #09090b;
        --card: #111215;
        --card2: #17181c;
        --line: rgba(255, 255, 255, 0.08);
        --ink: #ededf0;
        --sub: #9b9ca4;
        --mut: #64666e;
        --acc: #c9f24b;
        --acc-ink: #0b0d06;
        --font-ui: "Inter", -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
        --d: 905;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      #root {
        position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg);
        font-family: var(--font-ui); color: var(--ink); -webkit-font-smoothing: antialiased;
        font-variant-numeric: tabular-nums;
      }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      svg { display: block; flex: none; }
      .a { position: absolute; }

      /* ---------- camera ---------- */
      #glow { background: radial-gradient(ellipse 52% 60% at 50% 50%, rgba(201, 242, 75, 0.10) 0%, rgba(201, 242, 75, 0) 70%); }
      #stage { perspective: calc(var(--d) * 1px); perspective-origin: 50% 50%; }
      #world { position: absolute; left: 960px; top: 540px; width: 0; height: 0; transform-style: preserve-3d; }
      #world > * { position: absolute; }
      #wins, #rings, #slices { left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }

      /* hall */
      .wall { background-color: #0a0b0e; }
      #floor, #ceil {
        width: 2760px; height: 2800px; margin: -1400px 0 0 -1380px;
        background:
          repeating-linear-gradient(to bottom, rgba(255,255,255,0) 0 278px, rgba(255,255,255,0.12) 278px 280px),
          repeating-linear-gradient(to right, rgba(255,255,255,0) 0 343px, rgba(255,255,255,0.075) 343px 345px),
          linear-gradient(to bottom, #171a20 0%, #0b0c0f 70%);
      }
      #wl, #wr {
        width: 2800px; height: 1552px; margin: -776px 0 0 -1400px;
        background:
          repeating-linear-gradient(to right, rgba(255,255,255,0) 0 278px, rgba(255,255,255,0.10) 278px 280px),
          linear-gradient(to right, #08090b 0%, #14161b 100%);
      }
      .strip {
        width: 6px; height: 2800px; margin: -1400px 0 0 -3px; border-radius: 3px;
        background: var(--acc); box-shadow: 0 0 22px 4px rgba(201, 242, 75, 0.55);
      }
      .rg { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
      .rb { position: absolute; background: rgba(255, 255, 255, 0.20); }
      .rb.h { width: 2756px; height: 2px; margin: -1px 0 0 -1378px; }
      .rb.v { width: 2px; height: 1548px; margin: -774px 0 0 -1px; }
      #endw { width: 2799px; height: 1575px; margin: -787px 0 0 -1399px; background: #0b0c0e; }
      #dash { position: absolute; left: 74px; top: 42px; width: 1866px; height: 1050px; transform: scale(1.42); transform-origin: 0 0; }
      #dimw { position: absolute; left: 0; top: 0; width: 2799px; height: 1575px; background: #09090b; opacity: 0.22; }
      #dimL {
        position: absolute; left: 0; top: 0; width: 2799px; height: 1575px; opacity: 0;
        background: linear-gradient(90deg, rgba(9,9,11,0.985) 0%, rgba(9,9,11,0.97) 60%, rgba(9,9,11,0.72) 72%, rgba(9,9,11,0.55) 86%, rgba(9,9,11,0.50) 100%);
      }

      /* floating windows */
      .wp { position: absolute; }
      .wi {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 18px; overflow: hidden;
        background: var(--card); box-shadow: 0 0 0 1px rgba(255,255,255,0.10), 0 40px 90px rgba(0,0,0,0.55);
      }
      .wk { position: absolute; left: 0; top: 0; width: 440px; transform: scale(1.18); transform-origin: 0 0; }

      /* phone */
      #phone { left: -205px; top: -432px; width: 410px; height: 864px; transform-style: preserve-3d; }
      .sl { position: absolute; left: 0; top: 0; width: 410px; height: 864px; border-radius: 64px; background: #2d2e33; box-shadow: inset 0 0 0 2px #494a51; }
      #glass {
        position: absolute; left: 0; top: 0; width: 410px; height: 864px; border-radius: 64px; background: #000;
        box-shadow: inset 0 0 0 2px #55565d, inset 0 0 0 4px #1b1c1f; transform: translateZ(8px);
      }
      #screen { position: absolute; left: 10px; top: 10px; width: 390px; height: 844px; border-radius: 54px; overflow: hidden; background: #0b0b0d; }
      #shine { position: absolute; left: 0; top: 0; width: 410px; height: 864px; border-radius: 64px; background: linear-gradient(115deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0) 32%); pointer-events: none; }
      .cp { position: absolute; transform: translateZ(170px); }
      .ci {
        display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 22px 0 16px; border-radius: 27px; white-space: nowrap;
        background: rgba(24, 25, 29, 0.94); box-shadow: 0 0 0 1px rgba(255,255,255,0.14), 0 22px 50px rgba(0,0,0,0.5);
        font-size: 22px; font-weight: 500; letter-spacing: -0.015em;
      }
      .ci b { font-weight: 600; }
      .ci .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 4px rgba(201, 242, 75, 0.22); }
      .ci .up { color: var(--acc); font-weight: 600; }

      /* shared UI */
      .row { display: flex; align-items: center; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
      .hd { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 0; }
      .hd .tt { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
      .hd .tt svg { color: var(--sub); }
      .s { font-size: 11.5px; color: var(--sub); }
      .m { color: var(--mut); }
      .chip {
        display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; white-space: nowrap;
        font-size: 11.5px; font-weight: 500; background: rgba(255,255,255,0.06); color: var(--sub);
      }
      .chip.up { background: rgba(201, 242, 75, 0.12); color: var(--acc); }
      .btn {
        display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 8px; white-space: nowrap;
        font-size: 12.5px; font-weight: 500; color: var(--ink); background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10);
      }
      .btn.pri { background: var(--acc); color: var(--acc-ink); border-color: transparent; font-weight: 600; }
      .kbd { font-size: 10.5px; color: var(--sub); padding: 1px 5px; border-radius: 4px; background: rgba(255,255,255,0.07); }
      .av {
        display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; flex: none;
        color: #fff; font-weight: 600; letter-spacing: 0;
      }
      .mono { font-family: "JetBrains Mono", ui-monospace, monospace; }
      .hr { height: 1px; background: var(--line); }

      /* funnel */
      .fstep { padding: 0 16px; }
      .fbar { height: 30px; border-radius: 6px; display: flex; align-items: center; padding: 0 10px; font-size: 12px; font-weight: 600; color: var(--acc-ink); }
      .fdrop { font-size: 11px; color: var(--mut); padding-left: 2px; }

      /* retention */
      .rt { display: grid; padding: 12px 16px 0; row-gap: 4px; column-gap: 4px; font-size: 11.5px; }
      .rt .h { color: var(--mut); font-weight: 500; text-align: center; height: 20px; }
      .rt .c { height: 30px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-weight: 500; color: #f4ffd0; }
      .rt .l { display: flex; align-items: center; height: 30px; color: var(--sub); }
      .rt .u { display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; height: 30px; color: var(--mut); }

      /* lists */
      .li { display: flex; align-items: center; gap: 10px; padding: 0 16px; }
      .li .nm { font-size: 13px; font-weight: 500; }
      .li .ev { font-size: 11.5px; color: var(--sub); }
      .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 3px rgba(201,242,75,0.2); }
      .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.06); overflow: hidden; }
      .bar i { display: block; height: 100%; border-radius: 3px; background: var(--acc); }

      /* dashboard */
      #side { position: absolute; left: 0; top: 0; width: 232px; height: 1050px; background: #0c0d10; border-right: 1px solid var(--line); }
      #main { position: absolute; left: 232px; top: 0; width: 1634px; height: 1050px; background: #0a0a0c; }
      .nav { display: flex; align-items: center; gap: 10px; height: 34px; margin: 0 10px; padding: 0 10px; border-radius: 8px; font-size: 13.5px; font-weight: 500; color: var(--sub); }
      .nav.on { background: rgba(255,255,255,0.07); color: var(--ink); }
      .nav .bd { margin-left: auto; min-width: 20px; height: 20px; border-radius: 10px; padding: 0 6px; font-size: 11px; font-weight: 600; background: var(--acc); color: var(--acc-ink); display: flex; align-items: center; justify-content: center; }
      .sec { margin: 18px 20px 6px; font-size: 11.5px; font-weight: 500; color: var(--mut); }
      .kpi { position: absolute; height: 120px; padding: 16px 18px; }
      .kpi .lb { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--sub); font-weight: 500; }
      .kpi .vl { margin-top: 10px; font-size: 30px; font-weight: 600; letter-spacing: -0.03em; }
      .kpi svg.sp { position: absolute; right: 18px; bottom: 18px; }

      /* ---------- overlays ---------- */
      #vig { background: radial-gradient(ellipse 80% 85% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); pointer-events: none; }
      #fade { background: #000; }
      #lock { position: absolute; left: 170px; top: 0; width: 900px; height: 1080px; display: flex; flex-direction: column; justify-content: center; }
      #mark { width: 88px; height: 88px; opacity: 0; }
      #wm { margin-top: 34px; font-size: 156px; line-height: 150px; font-weight: 600; letter-spacing: -0.045em; opacity: 0; }
      #tg { margin-top: 26px; font-size: 40px; line-height: 50px; font-weight: 500; letter-spacing: -0.02em; color: var(--sub); opacity: 0; }
      #url {
        margin-top: 44px; width: 292px; height: 64px; border-radius: 32px; display: flex; align-items: center; justify-content: center; gap: 10px;
        font-size: 28px; font-weight: 600; color: var(--acc-ink); background: var(--acc); opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.5" data-width="1920" data-height="1080">
      <div id="glow" class="full"></div>

      <div id="stage" class="full">
        <div id="world">
          <!-- hall -->
          <div id="floor" class="wall" data-layout-ignore style="transform: translate3d(0, 776px, -1400px) rotateX(90deg)"></div>
          <div id="ceil" class="wall" data-layout-ignore style="transform: translate3d(0, -776px, -1400px) rotateX(90deg)"></div>
          <div id="wl" class="wall" data-layout-ignore style="transform: translate3d(-1380px, 0, -1400px) rotateY(90deg)"></div>
          <div id="wr" class="wall" data-layout-ignore style="transform: translate3d(1380px, 0, -1400px) rotateY(90deg)"></div>
          <div class="strip st" data-layout-ignore style="transform: translate3d(-1380px, 776px, -1400px) rotateX(90deg)"></div>
          <div class="strip st" data-layout-ignore style="transform: translate3d(1380px, 776px, -1400px) rotateX(90deg)"></div>
          <div class="strip st" data-layout-ignore style="transform: translate3d(-1380px, -776px, -1400px) rotateX(90deg)"></div>
          <div class="strip st" data-layout-ignore style="transform: translate3d(1380px, -776px, -1400px) rotateX(90deg)"></div>
          <div id="rings"></div>
          <div id="endw" style="transform: translate3d(0, 0, -2800px)">
            <div id="dash" data-layout-ignore></div>
            <div id="dimw"></div>
            <div id="dimL"></div>
          </div>

          <!-- floating windows -->
          <div id="wins" data-layout-ignore></div>

          <!-- subject -->
          <div id="phone">
            <div id="slices"></div>
            <div id="glass">
              <div id="screen" data-layout-ignore></div>
              <div id="shine"></div>
            </div>
            <div class="cp" data-layout-ignore style="left: 455px; top: 82px;">
              <div class="ci" id="chipA"><span class="dot"></span><span><b>2,418</b> online now</span></div>
            </div>
            <div class="cp" data-layout-ignore style="left: -355px; top: 732px;">
              <div class="ci" id="chipB"><span>Signups</span><span class="up">+6.1%</span><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#c9f24b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></div>
            </div>
          </div>
        </div>
      </div>

      <div id="vig" class="full"></div>

      <div id="lock">
        <svg id="mark" viewBox="0 0 48 48"><rect width="48" height="48" rx="12" fill="#c9f24b"/><path d="M12.5 17 24 36.5 35.5 17" stroke="#0b0d06" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="24" cy="12.5" r="3.4" fill="#0b0d06"/></svg>
        <div id="wm">Vantage</div>
        <div id="tg">Live product analytics on every screen.</div>
        <div id="url">vantage.app</div>
      </div>

      <div id="fade" class="full"></div>
    </div>

    <script>
      /* ---------- helpers ---------- */
      const ICON = {
        activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
        dash: '<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
        filter: '<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
        users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
        bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
        sliders: '<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
        search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
        down: '<path d="m6 9 6 6 6-6"/>',
        cal: '<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
        share: '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/>',
        zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
        globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
        repeat: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
        layers: '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
        flask: '<path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/>',
        home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
        trend: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
        card: '<rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/>',
        file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>',
        more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
        info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
        up: '<path d="M7 7h10v10"/><path d="M7 17 17 7"/>',
        dn: '<path d="M7 7l10 10"/><path d="M17 7v10H7"/>'
      };
      const ic = (n, s, sw, st) =>
        '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + (sw || 1.6) +
        '" stroke-linecap="round" stroke-linejoin="round"' + (st ? ' style="' + st + '"' : "") + ">" + ICON[n] + "</svg>";

      function rng(seed) {
        let a = seed >>> 0;
        return function () {
          a = (a + 0x6d2b79f5) >>> 0;
          let t = a;
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      function series(seed, n, base, wob, trend, wave) {
        const r = rng(seed);
        const out = [];
        let v = base;
        for (let i = 0; i < n; i++) {
          v += (r() - 0.46) * wob + trend;
          out.push(v + Math.sin(i * (wave || 0.9)) * wob * 0.7);
        }
        return out;
      }
      function smooth(pts) {
        let d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
        for (let i = 0; i < pts.length - 1; i++) {
          const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
          const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
          const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
          d += " C" + c1x.toFixed(1) + " " + c1y.toFixed(1) + " " + c2x.toFixed(1) + " " + c2y.toFixed(1) + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
        }
        return d;
      }
      function toPts(vals, w, h, lo, hi, padT, padB) {
        const n = vals.length;
        return vals.map((v, i) => [(i / (n - 1)) * w, padT + (1 - (v - lo) / (hi - lo)) * (h - padT - padB)]);
      }
      let GID = 0;
      function area(pts, h, col, id) {
        const g = "g" + ++GID;
        return '<defs><linearGradient id="' + g + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + col + '" stop-opacity="0.32"/><stop offset="1" stop-color="' + col + '" stop-opacity="0"/></linearGradient></defs>' +
          '<path ' + (id ? 'id="' + id + '" ' : "") + 'd="' + smooth(pts) + " L" + pts[pts.length - 1][0].toFixed(1) + " " + h + " L0 " + h + ' Z" fill="url(#' + g + ')"/>';
      }
      const fmt = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");

      const PEOPLE = {
        maya: ["Maya Chen", "MC", "#9a5470"],
        liam: ["Liam Ortiz", "LO", "#4f6fa8"],
        priya: ["Priya Nair", "PN", "#7a62a8"],
        sofia: ["Sofia Reyes", "SR", "#3f8a86"],
        ravi: ["Ravi Patel", "RP", "#4f8a5e"],
        dana: ["Dana Whitfield", "DW", "#a8774a"],
        alex: ["Alex Rivera", "AR", "#555b66"],
        noah: ["Noah Berg", "NB", "#8a7a43"]
      };
      const av = (k, s, f) => '<span class="av" style="width:' + s + "px;height:" + s + "px;font-size:" + f + "px;background:" + PEOPLE[k][2] + '">' + PEOPLE[k][1] + "</span>";

      /* ---------- components ---------- */
      function evRows(list, h) {
        return list.map((e) => {
          const p = PEOPLE[e[0]];
          return '<div class="li" style="height:' + h + 'px">' + av(e[0], 28, 10.5) +
            '<div style="flex:1;min-width:0"><div class="nm">' + p[0] + '</div><div class="ev mono">' + e[1] + '</div></div><div class="s m">' + e[2] + "</div></div>";
        }).join("");
      }
      const EVT = [
        ["maya", "checkout_completed", "4s"], ["liam", "plan_upgraded", "11s"], ["sofia", "report_exported", "18s"], ["ravi", "invite_sent", "26s"],
        ["dana", "page_viewed /pricing", "33s"], ["noah", "signup_completed", "41s"], ["alex", "dashboard_shared", "52s"], ["priya", "funnel_created", "1m"]
      ];
      function liveCard(rows, h, rowH, newRow) {
        return '<div class="hd"><div class="tt"><span class="pulse"></span>Live events</div><span class="chip">Last 5 min ' + ic("down", 12, 2) + "</span></div>" +
          '<div class="s" style="padding:4px 16px 8px 32px">Streaming from web, iOS and Android</div><div class="hr"></div>' +
          '<div style="overflow:hidden;height:' + (rows * rowH) + 'px">' +

        document.getElementById("dash").innerHTML = '<div id="side">' + side + '</div><div id="main"></div>';

        const top =
          '<div class="row" style="height:60px;padding:0 24px;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.08)">' +
          '<div class="row" style="gap:14px"><span style="font-size:19px;font-weight:600;letter-spacing:-0.02em">Overview</span>' +

          '<div class="row" style="gap:8px"><span class="btn">' + ic("cal", 14) + 'Nov 1 &ndash; Nov 30, 2026 ' + ic("down", 13, 2) + '</span><span class="btn">Compare to previous period</span><span class="btn">' + ic("filter", 14) + 'Filters</span><span class="btn pri">' + ic("share", 14, 2) + "Share</span></div></div>";

        const kp = (x, y, w, lab, ico, val, dl, up, seed, valId) => {
          const v = series(seed, 20, 50, 5, up ? 1.6 : -0.2, 0.8);
          const p = toPts(v, 120, 42, Math.min(...v) - 3, Math.max(...v) + 3, 3, 3);
          return '<div class="card kpi" style="left:' + x + "px;top:" + y + "px;width:" + w + 'px"><div class="lb">' + ic(ico, 15) + lab + '</div><div class="vl" ' + (valId ? 'id="' + valId + '"' : "") + ">" + val + '</div><span class="chip ' + (up ? "up" : "") + '" style="position:absolute;left:18px;bottom:14px">' + ic(up ? "up" : "dn", 11, 2.2) + dl + '</span>' +
            '<svg class="sp" width="120" height="42" viewBox="0 0 120 42"><path d="' + smooth(p) + '" fill="none" stroke="' + (up ? "#c9f24b" : "#8b8c94") + '" stroke-width="1.8" stroke-linecap="round"/></svg></div>';
        };
        const cw = 384;
        let body = kp(24, 84, cw, "Active users", "users", "48,213", "12.4%", true, 3) + kp(24 + (cw + 16), 84, cw, "Monthly revenue", "card", "$182,430", "8.2%", true, 21) +
          kp(24 + 2 * (cw + 16), 84, cw, "Conversion rate", "filter", "6.8%", "0.4 pt", true, 13) + kp(24 + 3 * (cw + 16), 84, cw, "Signups", "zap", "8,412", "6.1%", true, 9, "wSign");

        /* main chart */
        const cur = series(5, 30, 34, 3.2, 0.5, 0.65), prev = series(8, 30, 31, 3.0, 0.22, 0.7);
        const lo = 20, hi = 58;
        const cp = toPts(cur, 950, 270, lo, hi, 6, 6), pp = toPts(prev, 950, 270, lo, hi, 6, 6);
        let ch = '<div class="card" style="position:absolute;left:24px;top:220px;width:1036px;height:386px"><div class="hd"><div class="tt">' + ic("activity", 15) + 'Active users</div><div class="row" style="gap:16px"><span class="row s" style="gap:6px"><i style="width:14px;height:3px;border-radius:2px;background:#c9f24b"></i>Nov 1 &ndash; Nov 30</span><span class="row s" style="gap:6px"><i style="width:14px;border-top:2px dashed #6c6e76"></i>Previous period</span><span class="chip">Daily ' + ic("down", 12, 2) + '</span></div></div>' +
          '<div class="row" style="padding:10px 16px 0;gap:10px"><span style="font-size:28px;font-weight:600;letter-spacing:-0.035em">1.24M</span><span class="s">unique users this period</span><span class="chip up">' + ic("up", 11, 2.2) + '12.4%</span></div>' +
          '<svg width="1004" height="290" viewBox="0 0 1004 290" style="margin:6px 16px 0;overflow:visible">';
        [0, 1, 2, 3].forEach((g) => { const y = 6 + g * 86; ch += '<line x1="46" x2="1000" y1="' + y + '" y2="' + y + '" stroke="rgba(255,255,255,0.06)"/><text x="0" y="' + (y + 4) + '" font-size="11" fill="#64666e" font-family="Inter">' + (60 - g * 15) + "k</text>"; });
        ch += '<g transform="translate(50 0)">' + '<path d="' + smooth(pp) + '" fill="none" stroke="#6c6e76" stroke-width="1.8" stroke-dasharray="5 5" stroke-linecap="round"/>' + area(cp, 270, "#c9f24b") + '<path d="' + smooth(cp) + '" fill="none" stroke="#c9f24b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
          '<line x1="' + cp[22][0] + '" x2="' + cp[22][0] + '" y1="0" y2="270" stroke="rgba(255,255,255,0.18)" stroke-dasharray="3 4"/><circle cx="' + cp[22][0] + '" cy="' + cp[22][1].toFixed(1) + '" r="5" fill="#c9f24b" stroke="#111215" stroke-width="2"/>' +
          '<g transform="translate(' + (cp[22][0] - 70) + ' ' + (cp[22][1] - 66) + ')"><rect width="140" height="52" rx="8" fill="#1d1e23" stroke="rgba(255,255,255,0.12)"/><text x="12" y="21" font-size="11" fill="#9b9ca4" font-family="Inter">Wed, Nov 23</text><text x="12" y="40" font-size="14" font-weight="600" fill="#ededf0" font-family="Inter">46,902 users</text></g></g>' +
          ["Nov 1", "Nov 5", "Nov 9", "Nov 13", "Nov 17", "Nov 21", "Nov 25", "Nov 30"].map((d, i) => '<text x="' + (50 + i * (950 / 7)) + '" y="286" font-size="11" fill="#64666e" text-anchor="middle" font-family="Inter">' + d + "</text>").join("") + "</svg></div>";
        body += ch;
        body += '<div class="card" style="position:absolute;left:1076px;top:220px;width:534px;height:386px;overflow:hidden">' + liveCard(7, 44, 44, true).replace("Streaming from web, iOS and Android", "Streaming from web, iOS and Android") + "</div>";

        body += '<div class="card" style="position:absolute;left:1108px;top:622px;width:502px;height:392px;overflow:hidden">' + listCard("Top pages", "file", "Views", [["/pricing", 18204], ["/", 16980], ["/docs/quickstart", 9412], ["/blog/launch-week", 6730], ["/signup", 5821], ["/integrations/slack", 3904]], 48, true) + "</div>";
        document.getElementById("main").innerHTML = top + body;

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const EXPO = "expo.out";

      /* cubic-bezier easing (deterministic Newton solve) */
      function bez(x1, y1, x2, y2) {
        const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
        const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
        const X = (t) => ((ax * t + bx) * t + cx) * t;
        const Y = (t) => ((ay * t + by) * t + cy) * t;
        const dX = (t) => (3 * ax * t + 2 * bx) * t + cx;
        return function (p) {
          if (p <= 0) return 0;
          if (p >= 1) return 1;
          let t = p;
          for (let i = 0; i < 8; i++) {
            const e = X(t) - p, d = dX(t);
            if (Math.abs(e) < 1e-6 || Math.abs(d) < 1e-6) break;
            t -= e / d;
          }
          return Y(t);
        };
      }
      const camE = bez(0.55, 0.05, 0.5, 1);
      const D_PRE = 905, D0 = 950, D1 = 7000, D2 = 9800;
      const dollyEase = (p) => (D0 * Math.pow(D1 / D0, camE(p)) - D0) / (D1 - D0);
      const tiltEase = bez(0.3, 0, 0.1, 1);

      // black to picture
      tl.to("#fade", { opacity: 0, duration: 0.9, ease: "power1.out" }, 0);

      // hall: rings and strips light up from far to near
      for (let k = 1; k <= 9; k++) tl.fromTo("#rg" + k + " .rb", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.1 + (9 - k) * 0.05);
      tl.fromTo(".strip", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.1);

      // camera: short creep, then the dolly zoom (distance 950 -> 7000 while the subject plane stays 1:1), then a slow residual drift
      tl.fromTo("#stage", { "--d": D_PRE }, { "--d": D0, duration: 1.0, ease: "none" }, 0);
      tl.fromTo("#stage", { "--d": D0 }, { "--d": D1, duration: 4.8, ease: dollyEase, immediateRender: false }, 1.0);
      tl.fromTo("#stage", { "--d": D1 }, { "--d": D2, duration: 4.7, ease: "power1.out", immediateRender: false }, 5.8);

      // subject: rises in, tilt eases toward flat as the camera backs off
      tl.fromTo("#phone", { y: 70, rotationY: -30 }, { y: 0, rotationY: -16, duration: 1.2, ease: EXPO }, 0.1);
      tl.fromTo("#phone", { rotationY: -16 }, { rotationY: -9, duration: 4.5, ease: tiltEase, immediateRender: false }, 1.3);
      tl.fromTo("#phone", { rotationY: -9 }, { rotationY: -4, duration: 4.7, ease: "power1.out", immediateRender: false }, 5.8);

      // floating windows
      const WORDER = [0, 2, 1, 3, 5, 4];
      for (let i = 0; i < 6; i++) tl.fromTo("#wi" + WORDER[i], { y: 36, clipPath: "inset(-100px -100px 700px -100px)" }, { y: 0, clipPath: "inset(-100px -100px -100px -100px)", duration: 0.8, ease: EXPO }, 0.5 + i * 0.1);

      // every window is gone by 2.7 s, before the wall behind the phone is readable: the four far ones start at 1.6 s, the two nearest at 2.2 and 2.3 s; each fades over 0.4 s with power2.out from the start of its short sideways slide (450px), so none crosses a hall wall while visible
      const WEXIT = [[4, 1.6, -1], [1, 1.75, -1], [5, 1.9, 1], [3, 2.05, 1], [0, 2.2, -1], [2, 2.3, 1]];
      WEXIT.forEach((w) => {
        tl.to("#wi" + w[0], { x: w[2] * 450, duration: 0.6, ease: "power2.in" }, w[1]);
        tl.to("#wi" + w[0], { opacity: 0, duration: 0.4, ease: "power2.out" }, w[1]);
      });

      // foreground chips (z +170): pop in, then shrink as the camera backs away and leave before the wall fills behind them
      tl.fromTo("#chipA", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 0.9);
      tl.fromTo("#chipB", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 1.1);
      tl.to("#chipB", { opacity: 0, duration: 0.4, ease: "power2.in" }, 2.1);
      tl.to("#chipA", { opacity: 0, duration: 0.4, ease: "power2.in" }, 2.3);

      // phone screen: count-up and chart draw
      const setTxt = (sel, t, v) => tl.set(sel, { innerHTML: v }, t);
      for (let f = 0; f <= 36; f++) {
        const p = f / 36, e = 1 - Math.pow(1 - p, 3);
        setTxt("#pHero", 0.5 + f / 30, fmt(47602 + (48213 - 47602) * e));
      }
      tl.fromTo("#pLine", { strokeDasharray: 1200, strokeDashoffset: 1200 }, { strokeDashoffset: 0, duration: 1.3, ease: "power2.out" }, 0.5);
      tl.fromTo("#pArea", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power1.out" }, 0.9);
      tl.fromTo("#pDot", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 1.6);

      // cause beat at 5.0 s: a signup lands on the phone and on the web dashboard in the same frame
      tl.fromTo("#pNew", { height: 0, opacity: 0 }, { height: 38, opacity: 1, duration: 0.45, ease: EXPO }, 5.0);
      tl.to("#pNew", { backgroundColor: "rgba(201,242,75,0)", duration: 1.2, ease: "power1.out" }, 5.4);
      setTxt("#pSign", 5.0, "8,413");
      setTxt("#pOnline", 5.0, "2,419");
      setTxt("#wSign", 5.0, "8,413");
      tl.fromTo("#dash .newrow", { height: 0, opacity: 0 }, { height: 44, opacity: 1, duration: 0.45, ease: EXPO }, 5.0);
      tl.to("#dash .newrow", { backgroundColor: "rgba(201,242,75,0)", duration: 1.2, ease: "power1.out" }, 5.4);

      // lockup: wall darkens, windows and chips leave, subject slides right, name settles on the left
      tl.fromTo("#dimw", { opacity: 0.22 }, { opacity: 0.65, duration: 1.0, ease: "power2.out", immediateRender: false }, 6.2);
      tl.fromTo("#dimL", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.out" }, 6.2);
            tl.fromTo("#phone", { x: 0 }, { x: 470, duration: 1.3, ease: EXPO, immediateRender: false }, 6.3);
      tl.fromTo("#mark", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.8, ease: EXPO }, 6.7);
      tl.fromTo("#wm", { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.9, ease: EXPO }, 6.8);
      tl.fromTo("#tg", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.8, ease: EXPO }, 7.05);
      tl.fromTo("#url", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.7, ease: EXPO }, 7.3);

      tl.set({}, {}, 10.5);
      window.__timelines["main"] = tl;
    </script>
